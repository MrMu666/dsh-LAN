<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>DSH 远程</title>
<script>
// apply persisted theme before first paint (avoid flash)
try {
  if (window.localStorage.getItem("dsh-lan-theme") === "light") {
    document.documentElement.classList.add("light");
  }
} catch (e) {}
</script>
<style>
:root{
  --bg:#0f1117; --panel:#171a21; --panel2:#1e222c; --line:#2a2f3a;
  --fg:#e6e9ef; --dim:#9aa3b2; --accent:#4c8dff; --danger:#e5534b;
  --ok:#3fb950; --radius:12px; --code-bg:#0b0d12;
}
:root.light{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef1f5; --line:#d7dce3;
  --fg:#1c2128; --dim:#5b6570; --accent:#2f6fdc; --danger:#d1242f;
  --ok:#1a7f37; --code-bg:#eef1f5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;height:100dvh}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;min-height:38px;white-space:nowrap;overflow:visible;flex:none}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
input[type=password],input[type=text],textarea,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
textarea{resize:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:6px}
.dim{color:var(--dim)}
a{color:var(--accent);text-decoration:none}

/* login */
#login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px;max-width:420px;margin:0 auto;width:100%;position:relative}
#login h1{font-size:22px;margin:0;text-align:center}
#login .sub{color:var(--dim);text-align:center;font-size:13px;margin:-6px 0 8px}
#login label{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;margin-top:2px}
#login label input{width:auto}
.link{background:none;border:none;color:var(--dim);text-decoration:underline;min-height:0;padding:4px;font-size:12px;cursor:pointer;align-self:center}
.theme-btn{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;font-size:14px;line-height:1;flex:none}
#login .theme-btn{position:absolute;top:14px;right:14px}

/* views */
.view{flex:1;display:flex;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:8px;padding:10px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;margin:0;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
header button{padding:8px 11px;min-height:36px;white-space:nowrap}
#lock-btn{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}

#ws-list,#sess-list{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;min-width:0}
.card:active{background:var(--panel2)}
.card .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.card.running .dot{background:var(--ok);box-shadow:0 0 6px var(--ok);animation:dshDotPulse 1.6s ease-in-out infinite}
@keyframes dshDotPulse{0%,100%{opacity:1}50%{opacity:.35}}
.card .mid{flex:1;min-width:0}
.del-btn{flex:none;background:none;border:none;color:var(--dim);padding:6px;min-height:0;font-size:16px;line-height:1;cursor:pointer;opacity:.6;border-radius:8px}
.del-btn:active{opacity:1;color:var(--danger);background:var(--panel2)}
.card .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .m{color:var(--dim);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ws-status,#sess-status{padding:8px 14px;color:var(--dim);font-size:12px;text-align:center;flex:none}

/* folder browser sheet */
.crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.crumb{padding:4px 8px;border:none;background:none;color:var(--accent);min-height:0;font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsentries{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.wsentry{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--panel2);line-height:1.45;word-break:break-all;overflow-wrap:anywhere}
.wsentry::before{content:"📁\2002";font-size:12px}
.wsentry:active{background:var(--line)}
.wsentry.hidden::before{content:"·\2002"}
.wsentry.hidden{color:var(--dim)}

#chat-title{text-align:center;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;min-width:0}
/* two-row chat header: back/theme buttons sit at the sides and are vertically
   centered across the title row + the mode/permission row */
header.chat-head{flex-direction:row;align-items:center;gap:8px;padding:7px 10px}
header.chat-head .head-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:3px}
/* material back arrow — icon only, no border/background */
#back-btn{width:30px;height:30px;min-height:30px;padding:0;background:none;border:none;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
#back-btn svg{width:22px;height:22px;display:block}
#back-btn:active{opacity:.55}
header.chat-head .head-sub{display:flex;justify-content:center;gap:8px}
header.chat-head .head-sub button{min-height:0;height:20px;padding:0 10px;font-size:12px;line-height:20px;border-radius:10px}
header.chat-head .head-sub #mode-btn{flex:none;width:60px;padding:0;text-align:center}
header.chat-head .head-sub #perm-btn{flex:none;min-width:0;padding:0 8px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#files{flex:none;max-height:38%;overflow-y:auto;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px}
#files .ft{color:var(--dim);font-size:12px;font-weight:600;margin-bottom:4px}
#files .f{padding:5px 0;font-size:12.5px;font-family:ui-monospace,Consolas,monospace;border-bottom:1px dashed var(--line);word-break:break-all}
#files .f:last-child{border-bottom:none}
#sync-hint{flex:none;text-align:center;font-size:12px;color:var(--dim);padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--line)}

/* task list (todos projection — desktop TodoPanel parity) */
.todo-panel{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:5px 12px}
.todo-head{width:100%;text-align:left;background:none;border:none;padding:3px 0;color:var(--fg);font-size:13px;font-weight:600;min-height:0;cursor:pointer;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-head .todo-stats{color:var(--dim);font-weight:400;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-list{display:flex;flex-direction:column;gap:1px;padding:2px 0 5px}
.todo-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5}
.todo-glyph{flex:none;width:16px;height:16px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.todo-ring{display:block;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--dim)}
.todo-glyph.g-completed{color:var(--ok);font-size:13px;line-height:16px;font-weight:700}
.todo-glyph.g-in_progress .todo-ring{border-color:var(--accent);border-top-color:transparent;animation:dshSpin .8s linear infinite}
.todo-glyph.g-pending .todo-ring{border-style:dashed;border-color:var(--dim)}
.todo-content{min-width:0;word-break:break-word;overflow-wrap:anywhere}
.msgs-wrap{position:relative;flex:1;min-height:0;display:flex}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.pinbtn{position:absolute;right:12px;bottom:12px;z-index:5;width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.older-bar{display:block;width:100%;text-align:center;background:var(--panel2);border:1px dashed var(--line);color:var(--dim);font-size:12.5px;padding:10px;border-radius:10px;min-height:auto;flex:none}
.older-note{text-align:center;color:var(--dim);font-size:11.5px;padding:4px 0;flex:none}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;overflow-wrap:anywhere;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
/* user message row: copy button to the left of the bubble */
.msg-row{display:flex;gap:6px;align-items:flex-start;max-width:88%}
.msg-row.user-row{align-self:flex-end}
.msg-row .msg{align-self:auto;max-width:none;min-width:0}
.copy-btn{flex:none;align-self:center;background:none;border:none;color:var(--dim);padding:2px 4px;min-height:0;font-size:13px;line-height:1;cursor:pointer;opacity:.55}
.copy-btn:active{opacity:1}
.msg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.reason{max-width:88%;align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.reason summary{list-style:none;cursor:pointer;padding:7px 10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.reason.live summary{cursor:default}
.reason summary::-webkit-details-marker{display:none}
.reason summary .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:7px;vertical-align:middle}
.reason.live summary .dot{background:var(--accent);animation:dshPulse .5s ease-in-out infinite;box-shadow:0 0 8px var(--accent)}
.reason .rbody{padding:4px 10px 9px;border-top:1px dashed var(--line);white-space:pre-wrap;word-break:break-word;color:var(--dim)}
.tool{align-self:flex-start;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.tool summary{cursor:pointer;padding:8px 10px;color:var(--dim);display:block;min-width:0;overflow:hidden}
.tool summary .tn{color:var(--fg);font-weight:600;font-family:ui-monospace,Consolas,monospace;display:inline;white-space:normal;word-break:break-all}
.tool summary .tp{color:var(--dim);display:inline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.tool summary .tb2{color:var(--danger);display:inline;margin-left:6px;font-weight:600}
.tool .tb{padding:8px 10px;border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-all;color:var(--dim);max-height:240px;overflow-y:auto}
.tool.err .tn{color:var(--danger)}
#composer{flex:none;display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line)}
#composer textarea{flex:1;min-width:0;height:38px;min-height:38px;max-height:120px;overflow-y:auto;line-height:1.45;padding:8px 12px}
#cmd-btn{flex:none;align-self:center;width:34px;height:34px;min-height:34px;padding:0;background:none;border:none;color:var(--dim);display:flex;align-items:center;justify-content:center;border-radius:8px}
#cmd-btn svg{width:22px;height:22px;display:block}
#cmd-btn:active{opacity:.55}
#send-btn{flex:none;align-self:center;width:38px;height:38px;min-height:38px;padding:0;border-radius:11px;display:flex;align-items:center;justify-content:center}
#send-btn svg{width:20px;height:20px;display:block}
#send-btn.stop{background:var(--danger);border-color:var(--danger);color:#fff}

/* conversation loading animation */
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;margin:auto;color:var(--dim);font-size:13px;padding:32px 0}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:dshSpin .8s linear infinite}
@keyframes dshSpin{to{transform:rotate(360deg)}}

/* bottom stat bar: model chip (fixed height) + two-line stats */
#statbar{flex:none;display:flex;align-items:center;gap:8px;padding:4px 8px calc(4px + env(safe-area-inset-bottom));background:var(--panel)}
#sb-model{min-height:28px;padding:4px 12px;font-size:12px;border-radius:999px;max-width:58%;overflow:hidden;text-overflow:ellipsis;align-self:center}
#sb-stats{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.sb-line{font-size:11px;line-height:1.35;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

/* hierarchical pickers: provider chips → model list → effort chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:32px;padding:6px 12px;border-radius:999px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.mlist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.mrow{display:block;text-align:left;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);width:100%}
.mrow.on{border-color:var(--accent);background:rgba(76,141,255,.12)}
.mrow .mn{font-weight:600;display:block}
.mrow .md{color:var(--dim);font-size:12px;display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* reasoning breathing animation while working */
@keyframes dshPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.45)}}

/* markdown inside assistant messages */
.msg.assistant .mdp{display:flex;flex-direction:column;gap:4px}
.msg.assistant .mdl{white-space:pre-wrap}
.msg.assistant .mdh1{font-size:16px;font-weight:700;margin-top:4px}
.msg.assistant .mdh2{font-size:15px;font-weight:700;margin-top:3px}
.msg.assistant .mdh3{font-size:14px;font-weight:600;margin-top:2px}
.msg.assistant .mdh4{font-size:13px;font-weight:600}
.msg.assistant .mdli{padding-left:14px;position:relative}
.msg.assistant .mdli::before{content:"•";position:absolute;left:2px;color:var(--dim)}
.msg.assistant .mdq{color:var(--dim);border-left:2px solid var(--line);padding-left:8px;margin:2px 0}
.msg.assistant .mdc{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;overflow-x:auto;margin:4px 0}
.msg.assistant .mdtw{overflow-x:auto;margin:4px 0;-webkit-overflow-scrolling:touch}
.msg.assistant .mdt{border-collapse:collapse;width:max-content;min-width:100%;font-size:13px}
.msg.assistant .mdt th,.msg.assistant .mdt td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.msg.assistant .mdt th{background:var(--code-bg);font-weight:600}
.msg.assistant .mdt td{background:var(--panel)}
.msg.assistant .ic{font-family:ui-monospace,Consolas,monospace;background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
.msg.assistant a{color:var(--accent);text-decoration:underline}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:50}
.sheet .cardx{width:100%;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:80dvh;overflow-y:auto}
.sheet h2{margin:0;font-size:15px}
.sheet .row{display:flex;gap:8px;align-items:center}
.sheet .row select,.sheet .row input{flex:1;min-width:0}
.sheet .row button{flex:none}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end}
.sheet .actions button{flex:1;text-align:center}

/* pending interaction dialogs (approval / ask_user_question) */
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:80;padding:18px}
.dlg .cardx{width:100%;max-width:400px;max-height:82dvh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.dlg .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(76,141,255,.15);color:var(--accent);font-weight:600;flex:none;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg .tag.warn{background:rgba(229,83,75,.15);color:var(--danger)}
.dlg .q{font-size:14px;line-height:1.55;overflow-wrap:anywhere;word-break:break-word}
.dlg .hd{color:var(--dim);font-size:12px;font-weight:600}
.dlg .detail{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;color:var(--dim)}
.dlg .opts{display:flex;flex-direction:column;gap:8px}
.dlg .opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;padding:11px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);white-space:normal}
.dlg .opt .ck{width:20px;height:20px;flex:none;margin-top:1px;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.dlg .opt.on{border-color:var(--accent);background:rgba(76,141,255,.12)}
.dlg .opt.on .ck{background:var(--accent);border-color:var(--accent)}
.dlg .opt.on .ck::after{content:"✓"}
.dlg .opt .ol{flex:1;min-width:0;display:block}
.dlg .opt .ol .on{display:block;font-weight:600;word-break:break-word}
.dlg .opt .ol .od{display:block;color:var(--dim);font-size:12px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.dlg .dlg-actions{display:flex;gap:8px}
.dlg .dlg-actions button{flex:1;text-align:center}
.dlg .state{color:var(--ok);font-size:13px;text-align:center}
</style>
</head>
<body>

<div id="login">
  <button id="login-theme" class="theme-btn" title="切换主题">☀️</button>
  <h1>DSH 远程</h1>
  <div class="sub" id="login-sub">输入访问口令后进入</div>
  <input id="pw" type="password" placeholder="访问口令" autocomplete="current-password">
  <label><input type="checkbox" id="remember"> 记住口令（仅保存在本机浏览器）</label>
  <button id="login-btn" class="primary">进入</button>
  <button id="desktop-link" class="link">使用桌面版界面</button>
  <div class="err" id="login-err"></div>
</div>

<div id="workspaces" class="view hidden">
  <header>
    <button id="lock-btn">锁定</button>
    <h1>工作区</h1>
    <button id="ws-theme" class="theme-btn">☀️</button>
    <button id="add-ws-btn" class="primary">＋添加</button>
  </header>
  <div id="ws-list"></div>
  <div id="ws-status">加载中…</div>
</div>

<div id="sessions" class="view hidden">
  <header>
    <button id="ws-back-btn">‹ 返回</button>
    <h1 id="sess-ws-title">会话</h1>
    <button id="new-btn" class="primary">＋新建</button>
  </header>
  <div id="sess-list"></div>
  <div id="sess-status">加载中…</div>
</div>

<div id="chat" class="view hidden">
  <header class="chat-head">
    <button id="back-btn" title="返回" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="head-mid">
      <div id="chat-title">…</div>
      <div class="head-sub">
        <button id="mode-btn" title="工作模式">模式</button>
        <button id="perm-btn" title="访问权限">权限</button>
      </div>
    </div>
    <button id="chat-theme" class="theme-btn" title="切换主题">☀️</button>
  </header>
  <div id="files" class="hidden">
    <div class="ft">文件记录</div>
    <div id="files-list"></div>
  </div>
  <div id="sync-hint" class="hidden"></div>
  <div id="todo-panel" class="todo-panel hidden"></div>
  <div class="msgs-wrap">
    <div id="msgs"></div>
    <button id="pin-btn" class="pinbtn hidden" title="回到最新消息">↓</button>
  </div>
  <div id="composer">
    <button id="cmd-btn" title="命令" aria-label="命令">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
