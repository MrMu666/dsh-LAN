<script>
"use strict";
(function () {
  const $ = (id) => document.getElementById(id);
  const LS_KEY = "dsh-lan-key";
  const THEME_KEY = "dsh-lan-theme";
  const PRESET_SHORT = {
    standard: "标准",
    code: "PTC",
    minimal: "极简",
    cordis: "创造"
  };
  function presetShortName(id) {
    return PRESET_SHORT[id] || id || "模式";
  }

  // ── crypto.randomUUID polyfill (http:// LAN = non-secure context) ────────
  if (typeof window.crypto !== "undefined" && typeof window.crypto.randomUUID !== "function") {
    window.crypto.randomUUID = function randomUUID() {
      const bytes = new Uint8Array(16);
      window.crypto.getRandomValues(bytes);
      bytes[6] = (bytes[6] & 15) | 64;
      bytes[8] = (bytes[8] & 63) | 128;
      const hex = Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
      return hex.slice(0, 8) + "-" + hex.slice(8, 12) + "-" + hex.slice(12, 16) + "-" + hex.slice(16, 20) + "-" + hex.slice(20);
    };
  }

  // ── theme ────────────────────────────────────────────────────────────────
  function currentTheme() {
    try { return window.localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark"; } catch (e) { return "dark"; }
  }
  function applyTheme(theme) {
    document.documentElement.classList.toggle("light", theme === "light");
  }
  function refreshThemeButtons() {
    const light = currentTheme() === "light";
    for (const el of document.querySelectorAll(".theme-btn")) el.textContent = light ? "🌙" : "☀️";
  }
  function toggleTheme() {
    const next = currentTheme() === "light" ? "dark" : "light";
    try { window.localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next);
    refreshThemeButtons();
  }

  // ── key storage (remember = localStorage, else sessionStorage) ──────────
  function getKey() {
    return window.localStorage.getItem(LS_KEY) ?? window.sessionStorage.getItem(LS_KEY) ?? "";
  }
  function setKey(k, remember) {
    clearKey();
    if (remember) window.localStorage.setItem(LS_KEY, k);
    else window.sessionStorage.setItem(LS_KEY, k);
  }
  function clearKey() {
    window.localStorage.removeItem(LS_KEY);
    window.sessionStorage.removeItem(LS_KEY);
  }

  // ── RPC helpers ──────────────────────────────────────────────────────────
  function rpcId() {
    return window.crypto.randomUUID();
  }
  async function api(method, payload) {
    const body = JSON.stringify({ type: "client-request", rpcId: rpcId(), method, payload: payload ?? {} });
    const res = await fetch("/api/" + method, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body
    });
    if (!res.ok) throw new Error("HTTP " + res.status + " " + method);
    const full = await res.json();
    if (!full.result || !full.result.ok) throw new Error((full.result && full.result.error && full.result.error.message) || "RPC failed: " + method);
    return full.result.value;
  }
  async function lanapi(method, payload) {
    const body = JSON.stringify({ type: "client-request", rpcId: rpcId(), method, payload: payload ?? {} });
    const res = await fetch("/lanapi/" + method, {
      method: "POST",
      headers: { "content-type": "application/json", "x-dsh-lan-key": getKey() },
      body
    });
    if (res.status === 403) { clearKey(); showLogin("口令已失效，请重新输入"); throw new Error("key required"); }
    if (!res.ok) throw new Error("HTTP " + res.status + " " + method);
    const full = await res.json();
    if (!full.result || !full.result.ok) throw new Error("RPC failed: " + method);
    return full.result.value;
  }

  // ── markdown ─────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inlineMd(s) {
    let t = escHtml(s);
    t = t.replace(/`([^`\n]+)`/g, '<span class="ic">$1</span>');
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    t = t.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return t;
  }
  // GFM table helpers: `| a | b |` header + `|---|---|` separator + data rows.
  function tableCells(line) {
    let s = String(line).trim();
    if (s.startsWith("|")) s = s.slice(1);
    if (s.endsWith("|") && !s.endsWith("\\|")) s = s.slice(0, -1);
    const cells = [];
    let buf = "";
    for (let k = 0; k < s.length; k++) {
      if (s[k] === "\\" && s[k + 1] === "|") { buf += "|"; k++; continue; }
      if (s[k] === "|") { cells.push(buf.trim()); buf = ""; continue; }
      buf += s[k];
    }
    cells.push(buf.trim());
    return cells;
  }
  function isTableSep(line) {
    const s = String(line).trim();
    return s.includes("|") && s.includes("-") && /^[\s|:-]+$/.test(s);
  }
  function isTableRow(line) {
    return String(line).includes("|") && !isTableSep(line);
  }
  function tableAlign(sep) {
    const s = String(sep).trim();
    const left = s.startsWith(":");
    const right = s.endsWith(":");
    if (left && right) return "center";
    if (right) return "right";
    if (left) return "left";
    return "";
  }
  function renderMarkdown(text) {
    const frag = document.createDocumentFragment();
    const lines = String(text).replace(/\r\n/g, "\n").split("\n");
    const blocks = [];
    let cur = [];
    const flush = () => { if (cur.length) { blocks.push(cur); cur = []; } };
    let i = 0;
    while (i < lines.length) {
      const fence = /^```/.test(lines[i]);
      if (fence) {
        flush();
        const code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        blocks.push({ code: code.join("\n") });
        continue;
      }
      if (i + 1 < lines.length && isTableRow(lines[i]) && isTableSep(lines[i + 1])) {
        flush();
        const head = tableCells(lines[i]);
        const aligns = tableCells(lines[i + 1]).map(tableAlign);
        i += 2;
        const rows = [];
        while (i < lines.length && isTableRow(lines[i])) { rows.push(tableCells(lines[i])); i++; }
        blocks.push({ table: { head, aligns, rows } });
        continue;
      }
      cur.push(lines[i]);
      i++;
    }
    flush();
    for (const b of blocks) {
      if (typeof b === "object" && b.code !== undefined) {
        const pre = document.createElement("pre");
        pre.className = "mdc";
        pre.textContent = b.code;
        frag.appendChild(pre);
        continue;
      }
      if (typeof b === "object" && b.table) {
        const wrap = document.createElement("div");
        wrap.className = "mdtw";
        const tbl = document.createElement("table");
        tbl.className = "mdt";
        const thead = document.createElement("thead");
        const hr = document.createElement("tr");
        b.table.head.forEach((h, idx) => {
          const th = document.createElement("th");
          if (b.table.aligns[idx]) th.style.textAlign = b.table.aligns[idx];
          th.innerHTML = inlineMd(h);
          hr.appendChild(th);
        });
        thead.appendChild(hr);
        tbl.appendChild(thead);
        if (b.table.rows.length) {
          const tbody = document.createElement("tbody");
          for (const row of b.table.rows) {
            const tr = document.createElement("tr");
            row.forEach((c, idx) => {
              const td = document.createElement("td");
              if (b.table.aligns[idx]) td.style.textAlign = b.table.aligns[idx];
              td.innerHTML = inlineMd(c);
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          }
          tbl.appendChild(tbody);
        }
        wrap.appendChild(tbl);
        frag.appendChild(wrap);
        continue;
      }
      const para = document.createElement("div");
      para.className = "mdp";
      for (const line of b) {
        if (/^\s*$/.test(line)) continue;
        let m;
        if ((m = /^(#{1,4})\s+(.*)$/.exec(line)) !== null) {
          const el = document.createElement("div");
          el.className = "mdh" + m[1].length;
          el.innerHTML = inlineMd(m[2]);
          para.appendChild(el);
        } else if (/^\s*[-*]\s+/.test(line)) {
          const el = document.createElement("div");
          el.className = "mdli";
          el.innerHTML = inlineMd(line.replace(/^\s*[-*]\s+/, ""));
          para.appendChild(el);
        } else if (/^\s*\d+\.\s+/.test(line)) {
          const el = document.createElement("div");
          el.className = "mdli";
          el.innerHTML = inlineMd(line.replace(/^\s*\d+\.\s+/, ""));
          para.appendChild(el);
        } else if (/^\s*>\s?/.test(line)) {
          const el = document.createElement("div");
          el.className = "mdq";
          el.innerHTML = inlineMd(line.replace(/^\s*>\s?/, ""));
          para.appendChild(el);
        } else {
          const el = document.createElement("div");
          el.className = "mdl";
          el.innerHTML = inlineMd(line);
          para.appendChild(el);
        }
      }
      if (para.childNodes.length) frag.appendChild(para);
    }
    return frag;
  }

  // ── views ────────────────────────────────────────────────────────────────
  function show(id) {
    for (const v of ["login", "workspaces", "sessions", "chat"]) $(v).classList.toggle("hidden", v !== id);
    if (id !== "chat") hidePendingDlg();
  }
  function showLogin(msg) {
    show("login");
    $("login-err").textContent = msg || "";
  }

  // ── password epoch polling (host changed/cleared the password) ──────────
  // The host bumps `passwordVersion` whenever the password is set or cleared;
  // the client polls /dsh-lan/status and locks itself out the moment that
  // changes, then clears its conversation caches.
  let lastPwVersion = -1;
  let lastPasswordSet = true;

  function setLoginGate(status) {
    const set = status.passwordSet === true;
    $("login-btn").disabled = !set;
    $("pw").disabled = !set;
    $("login-sub").textContent = set
      ? "输入访问口令后进入"
      : "主机未设置访问口令（请在本机 设置→局域网访问 中设置）";
  }

  function lockOut(status, msg) {
    clearKey();
    closeWs();
    clearCaches();
    showLogin(msg);
    setLoginGate(status);
  }

  function applyStatus(status) {
    const version = typeof status.passwordVersion === "number" ? status.passwordVersion : 0;
    const set = status.passwordSet === true;
    if (lastPwVersion === -1) { lastPwVersion = version; lastPasswordSet = set; return; }
    if (version === lastPwVersion && set === lastPasswordSet) return;
    const wasSet = lastPasswordSet;
    lastPwVersion = version;
    lastPasswordSet = set;
    if (!set) lockOut(status, "");                           // host cleared the password
    else if (!wasSet) { setLoginGate(status); showLogin(""); } // host just set a password
    else lockOut(status, "口令已更改，请重新输入");            // host changed the password
  }

  function startStatusPoll() {
    setInterval(() => {
      void (async () => {
        try { applyStatus(await (await fetch("/dsh-lan/status")).json()); } catch (e) {}
      })();
    }, 3000);
  }

  // ── login ────────────────────────────────────────────────────────────────
  async function tryLogin() {
    const pw = $("pw").value;
    const remember = $("remember").checked;
    if (!pw) { $("login-err").textContent = "请输入口令"; return; }
    try {
      const res = await fetch("/dsh-lan/unlock", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ password: pw })
      });
      const data = await res.json();
      if (res.ok && data.ok === true) {
        setKey(pw, remember);
        $("pw").value = "";
        $("login-err").textContent = "";
        await enterWorkspaces();
      } else {
        $("login-err").textContent = "口令错误";
      }
    } catch (e) {
      $("login-err").textContent = "无法连接：" + (e && e.message);
    }
  }

  async function boot() {
    // v40: return-to-tab recovery — timers freeze and the WebSocket dies
    // silently while backgrounded; catch up + settle indicators on return
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") onForeground();
    });
    window.addEventListener("pageshow", (e) => {
      if (e.persisted) onForeground(); // bfcache restore — JS was frozen
    });
    applyTheme(currentTheme());
    refreshThemeButtons();
    for (const id of ["login-theme", "ws-theme", "chat-theme"]) {
      $(id).addEventListener("click", toggleTheme);
    }
    $("login-btn").addEventListener("click", tryLogin);
    $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
    $("desktop-link").addEventListener("click", () => {
      window.sessionStorage.setItem("dsh-lan-force-desktop", "1");
      window.location.replace("/");
    });
    $("lock-btn").addEventListener("click", () => { clearKey(); closeWs(); clearCaches(); showLogin(""); });
    $("add-ws-btn").addEventListener("click", openWsSheet);
    $("ws-back-btn").addEventListener("click", () => { closeWs(); enterWorkspaces(); });
    $("new-btn").addEventListener("click", openNewSheet);
    $("back-btn").addEventListener("click", () => { closeWs(); enterSessions(); });
    $("send-btn").addEventListener("click", () => {
      if (working) void stopTurn();
      else void send();
    });
    // Enter inserts a newline on mobile; sending happens via the button only
    $("input").addEventListener("input", (e) => autoresize(e.target));
    // scroll pinning: auto-follow the bottom only while the user is at the
    // bottom; scrolling up shows the ↓ button to jump back to the latest
    const msgsBox = $("msgs");
    msgsBox.addEventListener("scroll", () => {
      const near = msgsBox.scrollHeight - msgsBox.scrollTop - msgsBox.clientHeight < 40;
      setPinned(near);
    });
    $("pin-btn").addEventListener("click", () => {
      msgsBox.scrollTop = msgsBox.scrollHeight;
      setPinned(true);
    });
    $("mode-btn").addEventListener("click", openModeSheet);
    $("perm-btn").addEventListener("click", openPermSheet);
    $("perm-cancel").addEventListener("click", () => $("perm-sheet").classList.add("hidden"));
    $("sb-model").addEventListener("click", openModelsSheet);
    $("cmd-btn").addEventListener("click", openCmdSheet);
    $("cmd-cancel").addEventListener("click", () => $("cmd-sheet").classList.add("hidden"));
    $("m-cancel").addEventListener("click", () => $("models-sheet").classList.add("hidden"));
    $("m-save").addEventListener("click", saveModel);
    $("mode-cancel").addEventListener("click", () => $("mode-sheet").classList.add("hidden"));
    $("n-cancel").addEventListener("click", () => $("new-sheet").classList.add("hidden"));
    $("n-create").addEventListener("click", createSession);
    $("ws-cancel").addEventListener("click", () => $("ws-sheet").classList.add("hidden"));
    $("ws-pick").addEventListener("click", pickWorkspace);
    $("ws-mkdir").addEventListener("click", mkdirInWs);
    $("ws-goto").addEventListener("click", gotoPath);
    $("ws-path").addEventListener("keydown", (e) => { if (e.key === "Enter") gotoPath(); });
    $("ws-drive").addEventListener("change", () => {
      const root = $("ws-drive").value;
      if (root) void browseDir(root);
    });
    try {
      const status = await (await fetch("/dsh-lan/status")).json();
      lastPwVersion = typeof status.passwordVersion === "number" ? status.passwordVersion : 0;
      lastPasswordSet = status.passwordSet === true;
      startStatusPoll();
      if (!lastPasswordSet) {
        showLogin("");
        setLoginGate(status);
        return;
      }
      const stored = getKey();
      if (stored) {
        const res = await fetch("/dsh-lan/unlock", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: stored }) });
        const data = await res.json();
        if (res.ok && data.ok === true) { await enterWorkspaces(); return; }
        clearKey();
      }
      showLogin("");
    } catch (e) {
      showLogin("无法连接服务器：" + (e && e.message));
    }
  }

  // ── workspaces ───────────────────────────────────────────────────────────
  let workspaces = [];
  let currentWs = null;
  let archivedIds = new Set();  // archived (deleted) session ids — hidden from lists

  async function enterWorkspaces() {
    show("workspaces");
    try {
      const value = await api("workspace.list", {});
      workspaces = value.items || [];
      archivedIds = new Set(value.archivedSessionIds || []);
      // running sessions → breathing dot on workspaces (same as session list)
      let runningIds = new Set();
      try {
        const sl = await api("session.list", {});
        for (const s of sl.items || []) if (s.running) runningIds.add(s.sessionId);
      } catch (e) {}
      renderWorkspaces(runningIds);
    } catch (e) {
      $("ws-status").textContent = "加载失败：" + (e && e.message);
    }
  }
  function renderWorkspaces(runningIds) {
    const list = $("ws-list");
    list.textContent = "";
    const running = runningIds || new Set();
    for (const w of workspaces) {
      const anyRunning = (w.sessionIds || []).some((id) => running.has(id));
      const el = document.createElement("div");
      el.className = "card" + (anyRunning ? " running" : "");
      const dot = document.createElement("div"); dot.className = "dot";
      const mid = document.createElement("div"); mid.className = "mid";
      const t = document.createElement("div"); t.className = "t"; t.textContent = w.title || "未命名工作区";
      const m = document.createElement("div"); m.className = "m";
      m.textContent = shortPath(w.path) + " · " + (w.sessionIds ? w.sessionIds.length : 0) + " 个会话";
      mid.appendChild(t); mid.appendChild(m);
      el.appendChild(dot); el.appendChild(mid);
      el.addEventListener("click", () => { currentWs = w; enterSessions(); });
      list.appendChild(el);
    }
    $("ws-status").textContent = workspaces.length === 0 ? "暂无工作区，点右上角添加" : workspaces.length + " 个工作区";
  }

  let wsPath = "";
  // drive-letter dropdown (Windows hosts only): probed once per sheet open
  let wsDriveRoots = []; // existing drive roots, e.g. ["C:\\", "D:\\"]
  let wsCurrentRoot = ""; // drive root of the folder currently shown
  let wsSheetSeq = 0; // invalidates stale probe results after close/reopen

  async function openWsSheet() {
    $("ws-sheet").classList.remove("hidden");
    $("ws-err").textContent = "";
    const seq = ++wsSheetSeq;
    wsDriveRoots = [];
    wsCurrentRoot = "";
    const drv = $("ws-drive");
    drv.textContent = "";
    drv.appendChild(new Option("检测盘符中…", ""));
    $("ws-drive-row").classList.remove("hidden");
    try {
      const value = await api("host.listDirectory", {});
      applyDirListing(value);
      if (seq === wsSheetSeq) void probeDrives(value, seq);
    } catch (e) {
      $("ws-err").textContent = "无法浏览主机文件夹：" + (e && e.message);
    }
  }

  // Windows: probe A:–Z: and offer the existing drives in the dropdown.
  // POSIX hosts have no drive letters → the row stays hidden.
  async function probeDrives(listing, seq) {
    const sample = (listing && (listing.path || listing.home)) || "";
    if (!/^[A-Za-z]:[\\/]/.test(sample)) {
      if (seq === wsSheetSeq) $("ws-drive-row").classList.add("hidden");
      return;
    }
    const letters = [];
    for (let i = 0; i < 26; i++) letters.push(String.fromCharCode(65 + i));
    const settled = await Promise.allSettled(letters.map((L) => apiWithTimeout("host.listDirectory", { path: L + ":\\" }, 8000)));
    if (seq !== wsSheetSeq) return; // sheet closed/reopened while probing
    wsDriveRoots = [];
    for (const s of settled) {
      if (s.status === "fulfilled" && s.value && s.value.path) wsDriveRoots.push(s.value.path);
    }
    renderDriveSelect();
  }
  function renderDriveSelect() {
    const drv = $("ws-drive");
    drv.textContent = "";
    for (let i = 0; i < wsDriveRoots.length; i++) {
      const root = wsDriveRoots[i];
      drv.appendChild(new Option(root.replace(/\\$/, ""), root));
    }
    if (drv.options.length === 0) drv.appendChild(new Option("未检测到磁盘", ""));
    // select the drive we are currently on; fall back to the first option
    let target = "";
    for (let i = 0; i < drv.options.length; i++) {
      if (drv.options[i].value === wsCurrentRoot) { target = wsCurrentRoot; break; }
    }
    if (!target && drv.options.length > 0) target = drv.options[0].value;
    drv.value = target;
  }
  function applyDirListing(value) {
    wsPath = value.path;
    wsCurrentRoot = (value.crumbs && value.crumbs.length && value.crumbs[0].path) || "";
    // Windows-style host → drive dropdown; POSIX has no drive letters
    if (/^[A-Za-z]:[\\/]/.test(wsPath)) $("ws-drive-row").classList.remove("hidden");
    else $("ws-drive-row").classList.add("hidden");
    $("ws-path").value = value.path;
    const crumbs = $("ws-crumbs");
    crumbs.textContent = "";
    for (const crumb of value.crumbs || []) {
      const b = document.createElement("button");
      b.className = "crumb";
      b.textContent = crumb.name;
      b.addEventListener("click", () => { void browseDir(crumb.path); });
      crumbs.appendChild(b);
    }
    const box = $("ws-entries");
    box.textContent = "";
    for (const entry of value.entries || []) {
      const row = document.createElement("div");
      row.className = "wsentry" + (entry.hidden ? " hidden" : "");
      row.textContent = entry.name;
      row.addEventListener("click", () => { void browseDir(entry.path); });
      box.appendChild(row);
    }
    // keep the drive dropdown in sync with the folder being browsed
    renderDriveSelect();
  }
  async function gotoPath() {
    const path = $("ws-path").value.trim();
    if (!path) return;
    try {
      const value = await api("host.listDirectory", { path });
      applyDirListing(value);
    } catch (e) {
      $("ws-err").textContent = "无法打开路径：" + (e && e.message);
    }
  }
  async function browseDir(path) {
    try {
      const value = await api("host.listDirectory", { path });
      applyDirListing(value);
    } catch (e) {
      $("ws-err").textContent = "无法打开文件夹：" + (e && e.message);
    }
  }
  async function mkdirInWs() {
    const name = $("ws-newdir").value.trim();
    if (!name) return;
    try {
      const value = await api("host.createDirectory", { path: wsPath, name });
      $("ws-newdir").value = "";
      await browseDir(value.path);
    } catch (e) {
      $("ws-err").textContent = "新建文件夹失败：" + (e && e.message);
    }
  }
  async function pickWorkspace() {
    if (!wsPath) { $("ws-err").textContent = "请先选择一个文件夹"; return; }
    try {
      await api("workspace.create", { path: wsPath });
      $("ws-sheet").classList.add("hidden");
      await enterWorkspaces();
    } catch (e) {
      $("ws-err").textContent = "创建失败：" + (e && e.message);
    }
  }

  // ── sessions ─────────────────────────────────────────────────────────────
  async function enterSessions() {
    show("sessions");
    $("sess-ws-title").textContent = currentWs ? (currentWs.title || "工作区") : "会话";
    try {
      // refresh the archive set too — deleted sessions stay in session.list
      // but must be hidden from the UI
      try {
        const wsv = await api("workspace.list", {});
        archivedIds = new Set(wsv.archivedSessionIds || []);
      } catch (e) {}
      const value = await api("session.list", {});
      let items = value.items || [];
      if (currentWs) {
        const ids = new Set(currentWs.sessionIds || []);
        items = items.filter((s) => ids.has(s.sessionId));
      }
      items = items.filter((s) => !archivedIds.has(s.sessionId));
      renderSessions(items);
    } catch (e) {
      $("sess-status").textContent = "加载失败：" + (e && e.message);
    }
  }
  function renderSessions(items) {
    const list = $("sess-list");
    list.textContent = "";
    items.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    for (const s of items) {
      const title = (s.projections && s.projections.values && s.projections.values.title) || (s.blank ? "新会话" : "未命名会话");
      const el = document.createElement("div");
      el.className = "card" + (s.running ? " running" : "");
      const dot = document.createElement("div"); dot.className = "dot";
      const mid = document.createElement("div"); mid.className = "mid";
      const t = document.createElement("div"); t.className = "t"; t.textContent = title;
      const m = document.createElement("div"); m.className = "m";
      m.textContent = fmtTime(s.updatedAt) + " · " + (s.agentPreset || "standard");
      mid.appendChild(t); mid.appendChild(m);
      el.appendChild(dot); el.appendChild(mid);
      const del = document.createElement("button");
      del.className = "del-btn";
      del.textContent = "✕";
      del.title = "删除对话";
      del.addEventListener("click", (ev) => {
        ev.stopPropagation(); // don't open the chat
        confirmDelete(s, title);
      });
      el.appendChild(del);
      el.addEventListener("click", () => openChat(s));
      list.appendChild(el);
    }
    $("sess-status").textContent = items.length === 0 ? "此工作区暂无会话" : items.length + " 个会话 · 与主机实时同步";
  }

  function confirmDelete(s, title) {
    const card = $("confirm-card");
    if (!card) return;
    card.textContent = "";
    card.appendChild(mkEl("h2", null, "删除对话"));
    card.appendChild(mkEl("div", "q", "确定删除「" + title + "」吗？删除后将从列表移除（会话记录会归档保留）。"));
    const actions = mkEl("div", "dlg-actions");
    const cancel = mkEl("button", null, "取消");
    const ok = mkEl("button", "primary", "删除");
    ok.style.background = "var(--danger)";
    ok.style.borderColor = "var(--danger)";
    actions.appendChild(cancel);
    actions.appendChild(ok);
    card.appendChild(actions);
    $("confirm-dlg").classList.remove("hidden");
    const close = () => $("confirm-dlg").classList.add("hidden");
    cancel.addEventListener("click", close);
    ok.addEventListener("click", async () => {
      ok.disabled = true;
      ok.textContent = "删除中…";
      try {
        await api("workspace.archiveSession", { sessionId: s.sessionId });
        try { window.localStorage.removeItem(cacheKey(s.sessionId)); } catch (e) {}
        close();
        await enterSessions();
      } catch (e) {
        ok.disabled = false;
        ok.textContent = "删除";
        card.appendChild(mkEl("div", "err", "删除失败：" + (e && e.message)));
      }
    });
  }
  function fmtTime(ms) {
    if (!ms) return "";
    const d = new Date(ms);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const hm = d.toTimeString().slice(0, 5);
    return sameDay ? hm : (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
  }
  function shortPath(p) {
    const parts = String(p).split(/[\\/]/).filter(Boolean);
    return parts.length <= 2 ? String(p) : "…/" + parts.slice(-2).join("/");
  }

  // ── new session sheet ────────────────────────────────────────────────────
  async function openNewSheet() {
    $("new-sheet").classList.remove("hidden");
    $("n-err").textContent = "";
    try {
      const value = await api("agentPreset.list", {});
      const presets = value.presets || [];
      const sel = $("n-preset");
      sel.textContent = "";
      for (const p of presets) {
        const o = document.createElement("option");
        o.value = p.id;
        o.textContent = p.name || p.id;
        sel.appendChild(o);
      }
    } catch (e) {
      $("n-err").textContent = "无法读取模式列表：" + (e && e.message);
    }
  }
  async function createSession() {
    try {
      const payload = { agentPreset: $("n-preset").value || undefined };
      if (currentWs) payload.workspaceId = currentWs.workspaceId;
      const value = await api("session.create", payload);
      $("new-sheet").classList.add("hidden");
      const items = (await api("session.list", {})).items || [];
      const created = items.find((s) => s.sessionId === value.sessionId);
      if (created) await openChat(created);
      else await enterSessions();
    } catch (e) {
      $("n-err").textContent = "创建失败：" + (e && e.message);
    }
  }

  // ── chat ─────────────────────────────────────────────────────────────────
  let current = null;      // current session item
  let events = [];         // aggregated compact timeline
  let seenSeq = 0;
  let ws = null;
  let wsRetry = null;
  let hadWsOnce = false;   // first-connect status message only
  let pollTimer = null;
  let runningTimer = null; // session.list running watch (stop-btn authority)
  let lastFrameAt = 0;     // last WS frame timestamp (stale-connection watchdog)
  let wsWatchdogTimer = null;
  let statTimer = null;
  let working = false;     // turn in progress (breathing indicator + stop btn)
  let stopping = false;    // stop requested — suppress working=true until turn/end
  let pinned = true;       // auto-follow the bottom while streaming

  function setPinned(v) {
    if (pinned === v) return;
    pinned = v;
    const b = $("pin-btn");
    if (b) b.classList.toggle("hidden", v);
  }
  let tailEl = null;       // live assistant bubble element
  let tailEv = null;       // its aggregated event
  let reasonEl = null;     // live reasoning <details> element
  let reasonBodyEl = null; // its body element
  let reasonSumEl = null;  // its one-line summary text span
  let reasonEv = null;     // the reasoning block's aggregated event

  const SEND_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>';
  const STOP_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

  function setWorking(v) {
    // while a stop is in flight, ignore re-lights from late in-flight events
    // (chunks/tool calls that raced the cancel request)
    if (v && stopping) return;
    working = v;
    // send button ⇄ stop button (both rounded-square icon buttons)
    const sb = $("send-btn");
    if (sb) {
      if (v) {
        sb.innerHTML = STOP_ICON;
        sb.classList.add("stop");
        sb.title = "停止";
      } else {
        sb.innerHTML = SEND_ICON;
        sb.classList.remove("stop");
        sb.title = "发送";
      }
    }
    // while a turn is running, the mode/permission/model controls are locked
    for (const id of ["mode-btn", "perm-btn", "sb-model"]) {
      const b = $(id);
      if (b) b.disabled = v;
    }
  }

  async function openChat(session) {
    // persist the previous session's snapshot before switching away
    if (current && events.length > 0) saveCache(current.sessionId, events, seenSeq);
    current = session;
    show("chat");
    $("chat-title").textContent = (session.projections && session.projections.values && session.projections.values.title) || (session.blank ? "新会话" : "会话");
    // mode button shows the current work-mode short name by default
    const presetId = session.agentPreset || "standard";
    $("mode-btn").textContent = presetShortName(presetId);
    $("mode-btn").title = "工作模式：" + presetId;
    $("files-list").textContent = "";
    $("files").classList.add("hidden");
    $("input").value = "";
    autoresize($("input"));
    events = [];
    seenSeq = 0;
    oldestSeq = 0;
    olderMore = false;
    loadingOlder = false;
    todos = null;
    todosSeq = -1;
    todoOpen = false;
    renderTodoPanel();
    permOptions = [];
    permCurrent = "";
    permSeq = -1;
    // session.list already carries the permissions projection — apply it
    // immediately so the button shows the current state (e.g. "Full access")
    // even on the cached/zero-download path where history isn't re-fetched.
    if (session.projections && session.projections.values && session.projections.values.permissions !== undefined) {
      applyPermissions(session.projections.values.permissions, session.projections.asOfSeq);
    } else {
      renderPermBtn();
    }
    subscribedSeq = -1;
    pendingCacheSync = false;
    if (pendingCacheTimer !== null) { clearTimeout(pendingCacheTimer); pendingCacheTimer = null; }
    hadWsOnce = false;
    stopping = false;
    setWorking(false);
    setPinned(true);
    setSyncHint(null);
    currentModelLabel = "模型…";
    $("sb-line1").textContent = "";
    $("sb-line2").textContent = "";
    $("sb-model").textContent = currentModelLabel;
    // cache-first: paint the last snapshot instantly, then fetch only the
    // events newer than the cached position
    const cached = loadCache(session.sessionId);
    if (cached && cached.events.length > 0 && (cached.seenSeq || 0) > 0) {
      events = cached.events;
      seenSeq = cached.seenSeq;
      oldestSeq = cached.oldestSeq || 0;
      renderTimeline();
      subscribedSeq = -1;
      pendingCacheSync = true;
      setSyncHint(cached.updatedAt ? "已载入本地缓存（" + fmtTime(cached.updatedAt) + "）" : "已载入本地缓存");
      // Don't fetch history yet: openWs() will receive the session/subscribed
      // frame carrying the session's current lastSeq. If lastSeq <= seenSeq
      // the cache is already up-to-date → zero download. Otherwise run an
      // incremental catch-up (small pages). The 3s timer is a fallback for a
      // WS that never delivers the subscribed frame.
      if (pendingCacheTimer !== null) clearTimeout(pendingCacheTimer);
      pendingCacheTimer = setTimeout(() => {
        if (pendingCacheSync) {
          pendingCacheSync = false;
          const sid = current.sessionId;
          void syncHistory(sid, { quiet: false }).then((bridged) => {
            if (!current || current.sessionId !== sid) return; // switched away
            saveCache(sid, events, seenSeq);
            setSyncHint(bridged ? null : "已显示最新消息，更早内容点顶部按钮加载");
          });
        }
      }, 3000);
    } else {
      // loading animation while the tail window (one page) is fetched;
      // older pages load on demand via the "加载更早消息" button
      const loader = document.createElement("div");
      loader.className = "loading";
      const sp = document.createElement("div"); sp.className = "spinner";
      const lb = document.createElement("div"); lb.textContent = "正在加载对话…";
      loader.appendChild(sp); loader.appendChild(lb);
      $("msgs").textContent = "";
      $("msgs").appendChild(loader);
      try {
        const win = await fetchWindow(session.sessionId, 1);
        olderMore = win.hasMore;
        if (win.projections) applyProjections(win.projections);
        if (win.pages.length > 0) {
          ingestHistory(win.pages[0]);
        } else {
          const l = $("msgs").querySelector(".loading");
          if (l) l.remove();
        }
        saveCache(session.sessionId, events, seenSeq);
      } catch (e) {
        const l = $("msgs").querySelector(".loading");
        if (l) l.remove();
        appendStatus("历史加载失败：" + (e && e.message));
      }
    }
    openWs();
    startStatTimer();
    startRunningWatch();
    void refreshStatBar();
    void loadModelLabel();
    // any pending approval/question for this session (e.g. mux replay after
    // a reconnect, or an interaction queued while another session was open)
    showDialogIfCurrent();
  }

  function ingestHistory(list, liveFromSeq) {
    // list holds RAW event objects (fetchWindow strips the {event} wrapper)
    for (const ev of list) {
      if (!ev) continue;
      // seenSeq bookkeeping lives inside pushEvent (single dedupe point)
      pushEvent(ev, liveFromSeq !== undefined && ev.seq !== undefined && ev.seq > liveFromSeq);
    }
    renderTimeline();
  }

  function userMessageText(d) {
    const parts = Array.isArray(d.content) ? d.content : [];
    const texts = [];
    for (const p of parts) {
      if (p && p.type === "text" && typeof p.text === "string") texts.push(p.text);
    }
    return texts.join("\n");
  }

  function pushEvent(ev, live) {
    // seq dedupe: history replays, overlapping backward pages and WS frames
    // can all re-deliver the same event — only newer seqs are ever applied
    if (ev.seq !== undefined) {
      if (ev.seq <= seenSeq) return;
      seenSeq = ev.seq;
    }
    cacheDirty = true;
    aggregateInto(ev, events, live);
    if (oldestSeq === 0 && ev.seq !== undefined) oldestSeq = ev.seq;
    trimCompact();
  }

  // aggregate one raw session event into a compact timeline array (shared by
  // live streaming, history ingestion and the "load older" head insertion)
  function aggregateInto(ev, arr, live) {
    const t = ev.type;
    const d = ev.data || {};
    if (t === "user/message") {
      // user messages arrive as user/message (there is no user/text); skip
      // host-internal steering so it never shows as a user bubble: the
      // system-reminder marker (v11) and the runtime-context snapshot the
      // host injects as its own user/message before each turn (v41)
      const text = userMessageText(d);
      if (text.includes("<system-reminder>")) return;
      if (/^Current runtime context\./i.test(text.trimStart())) return;
      const last = arr[arr.length - 1];
      if (last && last.kind === "user" && last.optimistic === true && last.text === text) {
        // the streamed echo of our optimistic bubble — adopt it
        last.optimistic = false;
      } else {
        arr.push({ kind: "user", text });
      }
    } else if (t === "assistant/text") {
      const last = arr[arr.length - 1];
      if (last && last.kind === "assistant" && last.open) {
        last.text += d.text ?? "";
        last.open = false;
        last.reasonLive = false;
      } else {
        arr.push({ kind: "assistant", text: d.text ?? "", open: false, reasoning: "", live: true, reasonLive: false });
      }
    } else if (t === "assistant/chunk") {
      const c = d.chunk || {};
      if (live) setWorking(true);
      if (c.type === "text-delta" && typeof c.text === "string") {
        const last = arr[arr.length - 1];
        const reasoning = c.blockType === "reasoning";
        if (last && last.kind === "assistant" && last.open) {
          if (reasoning) { last.reasoning += c.text; last.reasonLive = true; }
          else last.text += c.text;
        } else {
          arr.push({ kind: "assistant", text: reasoning ? "" : c.text, open: true, reasoning: reasoning ? c.text : "", live: true, reasonLive: reasoning });
        }
      } else if (c.type === "reasoning-delta" && typeof c.text === "string") {
        // thinking text streams as reasoning-delta chunks
        const last = arr[arr.length - 1];
        if (last && last.kind === "assistant" && last.open) {
          last.reasoning += c.text;
          last.reasonLive = true;
        } else {
          arr.push({ kind: "assistant", text: "", open: true, reasoning: c.text, live: true, reasonLive: true });
        }
      } else if (c.type === "block-start" && c.blockType === "reasoning") {
        const last = arr[arr.length - 1];
        if (!last || last.kind !== "assistant" || !last.open) arr.push({ kind: "assistant", text: "", open: true, reasoning: "", live: true, reasonLive: true });
        else last.reasonLive = true;
      } else if (c.type === "block-end") {
        const last = arr[arr.length - 1];
        if (last && last.kind === "assistant") { last.open = false; last.reasonLive = false; }
      } else if (c.type === "finish") {
        // a step's stream ended — nothing to do. The working indicator must
        // stay lit until turn/end: after a job-output step the tool can run
        // silently for a long time with NO frames at all (measured 90s+), so
        // any "settle after a delay" here would flip the stop button back to
        // send mid-task (v44 — replaces the old 1.2s delayed working=false,
        // which v14 only patched for the tool/call race).
      }
      // tool-call-delta / usage carry no render impact here
    } else if (t === "turn/start") {
      if (live) setWorking(true);
    } else if (t === "turn/end") {
      if (live) {
        stopping = false;
        setWorking(false);
        // the turn ended without a normal block-end (stop/cancel mid-thinking):
        // clear the breathing state so the blue pulse dot stops flashing
        const last = arr[arr.length - 1];
        if (last && last.kind === "assistant") {
          last.reasonLive = false;
          last.open = false;
          last.live = false;
        }
      }
    } else if (t === "tool/call") {
      // the turn is still working — cancel any pending settle timer so the
      // stop button never flickers back during tool execution
      if (live) setWorking(true);
      const last = arr[arr.length - 1];
      if (last && last.kind === "assistant") last.reasonLive = false;
      arr.push({ kind: "tool", name: d.name ?? "tool", args: d.arguments, result: null, isError: false, callId: d.callId, open: true });
    } else if (t === "tool/result") {
      if (live) setWorking(true);
      const last = arr[arr.length - 1];
      const target = last && last.kind === "tool" && last.result === null ? last : null;
      if (target) {
        target.result = typeof d.content === "string" ? d.content : (d.content !== undefined ? JSON.stringify(d.content) : "");
        target.isError = !!d.isError;
        target.open = false;
      } else {
        arr.push({ kind: "tool", name: d.name ?? "tool", args: null, result: typeof d.content === "string" ? d.content : "", isError: !!d.isError, open: false });
      }
    }
    // assistant/message, step/start, step/end, agent/inbox/spliced: ignored
  }

  // bound the compact timeline: keep only the newest entries so memory,
  // rendering and the localStorage cache stay small on phones
  function trimCompact() {
    while (events.length > MAX_COMPACT) {
      events.shift();
    }
  }

  function collectFiles() {
    const set = new Set();
    const re = /"(?:[A-Za-z]:)?[^"]*?[\\/][^"\\/]+\.(?:tsx?|jsx?|mjs|cjs|json|ya?ml|md|html?|css|py|ps1|bat|sh|cs|java|go|rs|c|cpp|h|sql|csv|txt|log|png|jpe?g|gif|svg|webp)"/g;
    for (const e of events) {
      if (e.kind !== "tool") continue;
      const blobs = [JSON.stringify(e.args ?? null), e.result ?? ""];
      for (const b of blobs) {
        let m;
        while ((m = re.exec(b)) !== null) {
          let p = m[0].slice(1, -1);
          set.add(p);
        }
      }
    }
    return [...set];
  }

  function toolPreview(e) {
    // one-line preview of what follows the tool name (path/query etc.)
    const blob = e.args !== null && e.args !== undefined
      ? (typeof e.args === "string" ? e.args : JSON.stringify(e.args))
      : (e.result || "");
    const text = blob.replace(/[\\"{}]/g, " ").replace(/\s+/g, " ").trim();
    return text ? text.slice(0, 60) : "点击查看详情";
  }

  function reasonLineText(text) {
    const t = String(text || "");
    // the one-line summary shows the LATEST reasoning text: ellipsize the
    // head, keep the tail (newest words) visible
    return t.length > 120 ? "…" + t.slice(-119) : t;
  }

  function renderTimeline() {
    const box = $("msgs");
    // preserve which reasoning rows are expanded across re-renders — live
    // streaming rebuilds the timeline, which used to collapse them mid-read
    const expanded = new Set();
    for (const det of box.querySelectorAll(".reason[open]")) {
      if (det._reasonEv) expanded.add(det._reasonEv);
    }
    box.textContent = "";
    const frag = document.createDocumentFragment();
    tailEl = null;
    tailEv = null;
    reasonEl = null;
    reasonBodyEl = null;
    reasonSumEl = null;
    reasonEv = null;
    const total = events.length;
    const start = Math.max(0, total - MAX_RENDER);
    if (olderMore) {
      // "load older messages" button at the head of the timeline
      const bar = document.createElement("button");
      bar.className = "older-bar";
      bar.textContent = loadingOlder ? "正在加载更早消息…" : "加载更早消息";
      bar.disabled = loadingOlder;
      bar.addEventListener("click", () => void loadOlder());
      frag.appendChild(bar);
    } else if (start > 0) {
      const note = document.createElement("div");
      note.className = "older-note";
      note.textContent = "更早的 " + start + " 条消息未显示";
      frag.appendChild(note);
    }
    for (let i = start; i < total; i++) {
      const e = events[i];
      if (e.kind === "user") {
        // bubble + a small copy button on its left
        const row = document.createElement("div");
        row.className = "msg-row user-row";
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.title = "复制";
        btn.textContent = "⧉";
        btn.addEventListener("click", () => {
          copyText(e.text);
          btn.textContent = "✓";
          setTimeout(() => { btn.textContent = "⧉"; }, 800);
        });
        const div = document.createElement("div");
        div.className = "msg user";
        div.textContent = e.text || " ";
        row.appendChild(btn);
        row.appendChild(div);
        frag.appendChild(row);
      } else if (e.kind === "assistant") {
        if (e.reasoning) {
          // one-line gray reasoning row (collapsed by default); click toggles
          const det = document.createElement("details");
          det.className = "reason" + (e.reasonLive ? " live" : "");
          det._reasonEv = e;
          if (expanded.has(e) && !e.reasonLive) det.open = true;
          const sum = document.createElement("summary");
          const dot = document.createElement("span"); dot.className = "dot";
          const txt = document.createElement("span"); txt.className = "rt";
          txt.textContent = reasonLineText(e.reasoning);
          sum.appendChild(dot); sum.appendChild(txt);
          // while thinking (live) the row must stay collapsed and unclickable;
          // expansion is only allowed once the reasoning has finished
          sum.addEventListener("click", (ev) => {
            if (det.classList.contains("live")) {
              ev.preventDefault();
              det.open = false;
            }
          });
          det.appendChild(sum);
          const body = document.createElement("div"); body.className = "rbody";
          body.textContent = e.reasoning;
          det.appendChild(body);
          frag.appendChild(det);
          reasonEl = det;
          reasonBodyEl = body;
          reasonSumEl = txt;
          reasonEv = e;
        }
        if (e.text) {
          const div = document.createElement("div");
          div.className = "msg assistant";
          div.appendChild(renderMarkdown(e.text));
          frag.appendChild(div);
          tailEl = div;
          tailEv = e;
        }
      } else if (e.kind === "tool") {
        const det = document.createElement("details");
        det.className = "tool" + (e.isError ? " err" : "");
        const sum = document.createElement("summary");
        const tn = document.createElement("span"); tn.className = "tn"; tn.textContent = (e.name || "tool") + " ";
        const preview = toolPreview(e);
        const tp = document.createElement("span"); tp.className = "tp"; tp.textContent = preview;
        sum.appendChild(tn); sum.appendChild(tp);
        if (e.isError) {
          const badge = document.createElement("span"); badge.className = "tb2"; badge.textContent = "（失败）";
          sum.appendChild(badge);
        }
        det.appendChild(sum);
        const body = document.createElement("div"); body.className = "tb";
        const parts = [];
        if (e.args !== null && e.args !== undefined) parts.push("调用参数：" + (typeof e.args === "string" ? e.args : JSON.stringify(e.args)));
        if (e.result) parts.push((e.isError ? "错误" : "结果") + "：" + e.result);
        body.textContent = parts.join("\n\n").slice(0, 4000);
        det.appendChild(body);
        frag.appendChild(det);
      }
    }
    box.appendChild(frag);
    if (pinned) box.scrollTop = box.scrollHeight;
    renderFiles();
  }

  function updateTail() {
    const box = $("msgs");
    // stale refs (a new turn started since the last full render) — rebuild
    const last = events[events.length - 1];
    if (tailEv !== null && tailEv !== last) {
      renderTimeline();
      return;
    }
    if (reasonEl !== null && reasonBodyEl !== null && reasonEv !== null) {
      reasonBodyEl.textContent = reasonEv.reasoning || "";
      if (reasonSumEl !== null) reasonSumEl.textContent = reasonLineText(reasonEv.reasoning);
      reasonEl.classList.toggle("live", reasonEv.reasonLive === true);
    }
    if (tailEl !== null && tailEv !== null) {
      tailEl.textContent = "";
      tailEl.appendChild(renderMarkdown(tailEv.text || ""));
      if (pinned) box.scrollTop = box.scrollHeight;
      return;
    }
    renderTimeline();
  }

  function renderFiles() {
    const files = collectFiles();
    const wrap = $("files");
    const list = $("files-list");
    list.textContent = "";
    if (files.length === 0) { wrap.classList.add("hidden"); return; }
    wrap.classList.remove("hidden");
    for (const f of files.slice(0, 200)) {
      const div = document.createElement("div");
      div.className = "f";
      div.textContent = f;
      list.appendChild(div);
    }
  }

  function appendStatus(text) {
    const div = document.createElement("div");
    div.className = "msg assistant";
    div.textContent = text;
    $("msgs").appendChild(div);
  }

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  function copyText(text) {
    const t = String(text || "");
    // LAN is http:// (insecure context) — the async Clipboard API is often
    // unavailable, so execCommand is the primary path
    if (window.navigator.clipboard && window.navigator.clipboard.writeText) {
      window.navigator.clipboard.writeText(t).catch(() => fallbackCopy(t));
    } else {
      fallbackCopy(t);
    }
  }

  function applyLiveEvent(frame) {
    if (!current || frame.type !== "session/event" || frame.sessionId !== current.sessionId) return;
    const ev = frame.event;
    if (!ev || (ev.seq !== undefined && ev.seq <= seenSeq)) return;
    // NOTE: do NOT bump seenSeq here — pushEvent owns the seq bookkeeping
    // (its dedupe guard is `ev.seq <= seenSeq`; bumping first would make the
    // guard see equality and drop EVERY live event, killing realtime output
    // and the reasoning stream — the v20/v21 regression)
    pushEvent(ev, true);
    if (ev.type === "assistant/chunk") {
      const c = (ev.data || {}).chunk || {};
      // streaming text/thinking updates incrementally; tool-call-delta,
      // usage and finish need no render (state handled by pushEvent)
      if (c.type === "text-delta" || c.type === "reasoning-delta" || c.type === "block-end") {
        updateTail();
        return;
      }
      if (c.type === "block-start") {
        renderTimeline();
        return;
      }
      return;
    }
    renderTimeline();
  }

  function openWs() {
    closeWs();
    try {
      ws = new WebSocket("ws://" + location.host + "/api/events.mux");
      lastFrameAt = Date.now();   // fresh socket — restart the staleness window
      startWsWatchdog();
      ws.onopen = () => {
        if (!hadWsOnce) {
          hadWsOnce = true;
          appendStatus("已连接实时同步");
        } else {
          appendStatus("实时连接已恢复");
        }
      };
      ws.onmessage = (msg) => {
        try {
          const wire = JSON.parse(msg.data);
          lastFrameAt = Date.now(); // any frame proves the socket is alive
          // wire envelope: {type:"server-request", rpcId, method, payload}
          // the inner payload carries the session event (session/event,
          // session/subscribed, session/queue, …) or an answerable/push
          // interaction frame (approval/requested, question/requested, …)
          if (wire && wire.type === "server-request" && wire.payload) {
            const frame = wire.payload;
            if (frame.type === "session/event") {
              applyLiveEvent(frame);
            } else if (frame.type === "session/subscribed") {
              // carries the session's current lastSeq — a cache hit can skip
              // the download when already current, and a RECONNECT detects the
              // gap of events missed while the WS was down and bridges it with
              // the same incremental catch-up (v40: not gated on pendingCacheSync)
              if (current && frame.sessionId === current.sessionId) {
                const hadPending = pendingCacheSync;
                subscribedSeq = frame.lastSeq;
                if (hadPending) {
                  pendingCacheSync = false;
                  if (pendingCacheTimer !== null) { clearTimeout(pendingCacheTimer); pendingCacheTimer = null; }
                }
                if (frame.lastSeq > seenSeq) {
                  if (!hadPending) setSyncHint("正在同步新内容…");
                  const sid = current.sessionId;
                  void syncHistory(sid, { quiet: false }).then((bridged) => {
                    if (!current || current.sessionId !== sid) return; // switched away
                    saveCache(sid, events, seenSeq);
                    setSyncHint(bridged ? null : "已显示最新消息，更早内容点顶部按钮加载");
                    settleWorkingState(sid);
                  });
                } else if (hadPending) {
                  setSyncHint(null); // cache already current — zero download
                }
              }
            } else if (frame.type === "session/projection") {
              // live projection push (goal/todos/permissions…)
              if (current && frame.sessionId === current.sessionId) {
                if (frame.key === "todos") applyTodos(frame.value, frame.seq);
                else if (frame.key === "permissions") applyPermissions(frame.value, frame.seq);
              }
            } else if (frame.type === "approval/requested" || frame.type === "question/requested"
                || frame.type === "approval/resolved" || frame.type === "question/resolved") {
              onMuxInteraction(frame, wire.rpcId);
            }
          }
        } catch (e) {}
      };
      ws.onclose = () => {
        ws = null;
        scheduleWsRetry();
        startPolling();
      };
      ws.onerror = () => {
        try { ws.close(); } catch (e) {}
      };
    } catch (e) {
      scheduleWsRetry();
      startPolling();
    }
  }
  function scheduleWsRetry() {
    if (wsRetry !== null || !current || ws !== null) return;
    wsRetry = setTimeout(() => {
      wsRetry = null;
      if (current && ws === null) openWs();
    }, 2000);
  }
  function closeWs() {
    if (current && events.length > 0) saveCache(current.sessionId, events, seenSeq);
    stopWsWatchdog();
    if (ws) { try { ws.close(); } catch (e) {} ws = null; }
    if (wsRetry !== null) { clearTimeout(wsRetry); wsRetry = null; }
    stopPolling();
    stopStatTimer();
    stopRunningWatch();
  }
  function startPolling() {
    if (pollTimer || !current) return;
    pollTimer = setInterval(async () => {
      try {
        await syncHistory(current.sessionId, { quiet: true, liveFrom: seenSeq });
        if (cacheDirty) { cacheDirty = false; saveCache(current.sessionId, events, seenSeq); }
      } catch (e) {}
    }, 1000);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // ── stale-connection watchdog + foreground recovery (v40) ────────────────
  // Mobile browsers suspend background tabs: timers freeze and the WebSocket
  // often dies silently (half-open, no close frame) or closes unnoticed. The
  // polling fallback only starts on onclose, so a half-open socket leaves the
  // page with NO data path at all — the UI freezes mid-turn forever. The
  // watchdog force-rebuilds a socket silent for too long, and the
  // visibilitychange hook forces a catch-up + indicator settle on return.
  // v42: the watchdog only runs while a turn is in flight (working) — an idle
  // session legitimately sends no frames, so staleness is only meaningful
  // when the turn should be streaming.
  function startWsWatchdog() {
    stopWsWatchdog();
    wsWatchdogTimer = setInterval(() => {
      if (!current || ws === null || !working) return; // idle turns push no frames
      if (Date.now() - lastFrameAt < WS_STALE_MS) return;
      // half-open: no frames for WS_STALE_MS — rebuild so onclose → retry +
      // polling kick in; restart polling directly in case the close event
      // never fires on this platform
      appendStatus("实时连接已断开，正在重新连接…");
      try { ws.close(); } catch (e) {}
      ws = null;
      scheduleWsRetry();
      startPolling();
    }, WS_WATCHDOG_MS);
  }
  function stopWsWatchdog() {
    if (wsWatchdogTimer !== null) { clearInterval(wsWatchdogTimer); wsWatchdogTimer = null; }
  }
  function onForeground() {
    // the user returned to the tab after a background period — the live
    // stream may be gone or half-open, and events may have been missed
    if (!current) return;                           // not inside a chat view
    const sid = current.sessionId;
    if (ws !== null && Date.now() - lastFrameAt > WS_STALE_MS) {
      // half-open socket left over from the backgrounded period — rebuild
      try { ws.close(); } catch (e) {}
      ws = null;
    }
    if (ws === null) {
      appendStatus("回到前台，正在重新连接…");
      openWs();
    }
    lastFrameAt = Date.now();                       // fresh socket must not be killed early
    if (subscribedSeq < 0 || subscribedSeq > seenSeq) {
      // events may have been missed while backgrounded — bridge them
      void syncHistory(sid, { quiet: true }).then((bridged) => {
        if (!current || current.sessionId !== sid) return;
        saveCache(sid, events, seenSeq);
        if (!bridged) setSyncHint("已显示最新消息，更早内容点顶部按钮加载");
        settleWorkingState(sid);
      });
    } else {
      settleWorkingState(sid);
    }
  }
  function settleWorkingState(sid) {
    // After a catch-up, a turn that actually finished server-side must not
    // leave the "thinking" visuals hanging (breathing dot, locked controls) —
    // those normally end on a live turn/end, which was missed while the page
    // was backgrounded. The authoritative signal is the session list's
    // `running` flag — the exact same server-side state that drives the
    // breathing green dot on the session/workspace lists. A turn streaming
    // job output stays `running` server-side, so the stop button must keep
    // showing stop; only a server-confirmed idle turn is settled.
    setTimeout(() => {
      if (!current || current.sessionId !== sid) return;
      if (!working) return;
      if (subscribedSeq < 0 || subscribedSeq > seenSeq) return; // not fully caught up
      void api("session.list", {}).then((data) => {
        if (!current || current.sessionId !== sid) return; // switched away meanwhile
        const items = (data && data.items) || [];
        const s = items.find((x) => x.sessionId === sid);
        if (!s || s.running) return; // still running (or unknown) — keep working
        const last = events[events.length - 1];
        if (last && last.kind === "assistant") {
          last.reasonLive = false;
          last.open = false;
          last.live = false;
        }
        setWorking(false);
        renderTimeline();
      }).catch(() => {}); // query failed — leave the indicator as-is
    }, 2000);
  }
  // ── running watch (v45): the stop button mirrors the server-side `running`
  // flag — the same signal that lights the breathing green dot on the session
  // and workspace lists. Whatever the event stream does (silent job output,
  // reconnects, missed turn/end), this periodic calibration guarantees the
  // button shows STOP while the server says the turn is in flight, and flips
  // back to send shortly after the turn truly ends.
  function startRunningWatch() {
    stopRunningWatch();
    runningTimer = setInterval(() => {
      if (!current) return;
      const sid = current.sessionId;
      void api("session.list", {}).then((data) => {
        if (!current || current.sessionId !== sid) return; // switched away
        const items = (data && data.items) || [];
        const s = items.find((x) => x.sessionId === sid);
        if (!s) return; // unknown — leave the indicator as-is
        if (s.running) {
          // server says the turn is in flight — force the stop button on
          setWorking(true);
        } else if (working) {
          // server confirms idle — settle any hanging working state
          const last = events[events.length - 1];
          if (last && last.kind === "assistant") {
            last.reasonLive = false;
            last.open = false;
            last.live = false;
          }
          setWorking(false);
          renderTimeline();
        }
      }).catch(() => {}); // query failed — leave the indicator as-is
    }, 4000);
  }
  function stopRunningWatch() {
    if (runningTimer !== null) { clearInterval(runningTimer); runningTimer = null; }
  }

  // ── conversation cache (localStorage) + incremental history sync ────────
  // session.history pages BACKWARD from the tail (beforeSeq/maxMessages) and
  // has no forward "since" parameter — so an incremental load fetches the
  // tail page and bridges older pages until one reaches the cached seq.
  // v21: hard caps everywhere — one page of 40 messages can hold ~40k events
  // (a long reasoning stream), so unbounded windows make phones download
  // tens of MB and freeze the main thread.
  const CACHE_PREFIX = "dsh-lan-cache:";
  const CACHE_VERSION = 1;
  const CACHE_MAX_BYTES = 900 * 1024;   // per-session cap (~localStorage budget)
  const CACHE_MAX_ENTRIES = 2000;       // compact entries kept in the cache
  const SYNC_PAGE_MESSAGES = 40;        // messages per page (first visit / load-older)
  const DELTA_PAGE_MESSAGES = 8;        // messages per page for incremental catch-up
  const SYNC_MAX_PAGES = 40;            // bridge page budget (40×8 = 320 messages)
  const SYNC_EVENT_CAP = 200000;        // bridge event budget (one page can hold ~40k)
  const MAX_COMPACT = 4000;             // compact timeline entry cap (memory/dom)
  const MAX_RENDER = 1500;              // entries rendered per timeline pass
  const FETCH_TIMEOUT = 20000;          // history RPC timeout (ms)
  const WS_STALE_MS = 30000;            // no WS frames this long → half-open
  const WS_WATCHDOG_MS = 10000;         // stale-connection check interval
  let cacheDirty = false;
  let oldestSeq = 0;                    // smallest seq present in the timeline
  let olderMore = false;                // older pages exist (show "load older")
  let loadingOlder = false;
  let todos = null;                     // todos projection: null | [{content,status}]
  let todosSeq = -1;                    // projection watermark (higher-seq wins)
  let todoOpen = false;                 // task-list panel collapsed by default
  let permOptions = [];                 // permissions projection options [{value,name,description}]
  let permCurrent = "";                 // current permission preset value
  let permSeq = -1;                     // permissions projection watermark
  let subscribedSeq = -1;               // lastSeq from the mux session/subscribed frame
  let pendingCacheSync = false;         // cache hit → awaiting subscribed before sync
  let pendingCacheTimer = null;
  let syncPromise = null;               // in-flight syncHistory (dedupe concurrent calls)

  function cacheKey(sessionId) { return CACHE_PREFIX + sessionId; }

  function loadCache(sessionId) {
    try {
      const raw = window.localStorage.getItem(cacheKey(sessionId));
      if (!raw) return null;
      const c = JSON.parse(raw);
      // oldestSeq is required — pre-v21 caches lack it and would make the
      // "load older" head insertion overlap with existing content
      if (!c || c.v !== CACHE_VERSION || !Array.isArray(c.events) || typeof c.seenSeq !== "number" || typeof c.oldestSeq !== "number") return null;
      return c;
    } catch (e) { return null; }
  }

  function saveCache(sessionId, events, seenSeq) {
    try {
      // bound the entries BEFORE stringifying (no repeated O(n²) re-serialise)
      let trimmed = events.length > CACHE_MAX_ENTRIES ? events.slice(events.length - CACHE_MAX_ENTRIES) : events;
      const c = { v: CACHE_VERSION, updatedAt: Date.now(), seenSeq, oldestSeq, events: trimmed };
      let text = JSON.stringify(c);
      if (text.length > CACHE_MAX_BYTES && c.events.length > 100) {
        c.events = c.events.slice(Math.ceil(c.events.length / 2));
        text = JSON.stringify(c);
      }
      try {
        window.localStorage.setItem(cacheKey(sessionId), text);
      } catch (e) {
        // quota exceeded — drop other sessions' caches and retry once
        const mine = cacheKey(sessionId);
        const drop = [];
        for (let i = 0; i < window.localStorage.length; i++) {
          const k = window.localStorage.key(i);
          if (k && k.startsWith(CACHE_PREFIX) && k !== mine) drop.push(k);
        }
        for (const k of drop) window.localStorage.removeItem(k);
        window.localStorage.setItem(mine, text);
      }
    } catch (e) {}
  }

  function clearCaches() {
    try {
      const drop = [];
      for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && k.startsWith(CACHE_PREFIX)) drop.push(k);
      }
      for (const k of drop) window.localStorage.removeItem(k);
    } catch (e) {}
  }

  function setSyncHint(text) {
    const el = $("sync-hint");
    if (!el) return;
    el.textContent = text || "";
    el.classList.toggle("hidden", !text);
  }

  // ── task list (todos projection — desktop TodoPanel parity) ────────────
  // todo_write → todo/write event → 'todos' projection (null or [{content,
  // status: pending|in_progress|completed}], cleared on turn/start). Arrives
  // via the history tail-page projections block and session/projection frames.
  function applyProjections(block) {
    if (!block || typeof block.asOfSeq !== "number" || !block.values) return;
    if (block.values.todos !== undefined) {
      applyTodos(block.values.todos, block.asOfSeq);
    }
    if (block.values.permissions !== undefined) {
      applyPermissions(block.values.permissions, block.asOfSeq);
    }
  }

  function applyTodos(value, seq) {
    if (typeof seq === "number") {
      if (seq < todosSeq) return;   // stale projection — ignore (higher-seq wins)
      todosSeq = seq;
    }
    todos = Array.isArray(value) ? value : null;
    renderTodoPanel();
  }

  // ── access-permission preset (permissions projection) ──────────────────
  // /permission command presets: {options:[{value,name,description}], currentValue}
  function applyPermissions(value, seq) {
    if (typeof seq === "number") {
      if (seq < permSeq) return;
      permSeq = seq;
    }
    if (value && Array.isArray(value.options)) {
      permOptions = value.options;
      permCurrent = value.currentValue || "";
    } else {
      permOptions = [];
      permCurrent = "";
    }
    renderPermBtn();
  }

  function permDisplayName(name) {
    if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(name)) return name;
    if (name === "danger-full-access") return "Full access";
    return name.split("-").map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
  }

  function permLabel(value) {
    const opt = permOptions.find((o) => o.value === value);
    return permDisplayName(opt ? opt.name : value);
  }

  function renderPermBtn() {
    const btn = $("perm-btn");
    if (!btn) return;
    btn.textContent = permCurrent ? permLabel(permCurrent) : "权限";
    btn.title = "访问权限：" + (permCurrent ? permLabel(permCurrent) : "未知");
  }

  async function openPermSheet() {
    $("perm-sheet").classList.remove("hidden");
    $("perm-err").textContent = "";
    const list = $("perm-list");
    list.textContent = "";
    // "custom" is display-only, never a switchable target (desktop parity)
    const opts = permOptions.filter((o) => o.value !== "custom");
    if (opts.length === 0) {
      $("perm-err").textContent = "无法读取权限选项";
      return;
    }
    for (const o of opts) {
      const b = document.createElement("button");
      b.className = "mrow" + (o.value === permCurrent ? " on" : "");
      const nm = document.createElement("span"); nm.className = "mn"; nm.textContent = permDisplayName(o.name || o.value);
      b.appendChild(nm);
      if (o.description) {
        const d = document.createElement("span"); d.className = "md"; d.textContent = o.description;
        b.appendChild(d);
      }
      b.addEventListener("click", () => void selectPermission(o));
      list.appendChild(b);
    }
  }

  // execute a slash command via the Typert service remote POST /api/commands/execute
  async function execCommand(sessionId, line) {
    const body = JSON.stringify({ type: "client-request", rpcId: rpcId(), method: "commands/execute", payload: { args: { agentId: sessionId, line } } });
    const res = await fetch("/api/commands/execute", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const full = await res.json();
    if (!full.result || !full.result.ok) throw new Error((full.result && full.result.error && full.result.error.message) || "command failed");
    return full.result.value;
  }

  async function listCommands(sessionId) {
    const body = JSON.stringify({ type: "client-request", rpcId: rpcId(), method: "commands/list", payload: { args: { agentId: sessionId } } });
    const res = await fetch("/api/commands/list", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const full = await res.json();
    if (!full.result || !full.result.ok) throw new Error((full.result && full.result.error && full.result.error.message) || "list failed");
    return full.result.value;
  }

  async function openCmdSheet() {

    const list = $("cmd-list");

  function insertCommand(name) {

    input.value = "/" + name + " ";
    input.focus();
    autoresize(input);

  async function selectPermission(option) {
    // switching to full access is destructive-ish — confirm once (desktop parity)
    const isFullAccess = option.value === "danger-full-access";
    const doSwitch = async () => {
      try {
        await execCommand(current.sessionId, "/permission " + option.value);
        $("perm-sheet").classList.add("hidden");
        appendStatus("已切换权限：" + permDisplayName(option.name || option.value));
      } catch (e) {
        $("perm-err").textContent = "切换失败：" + (e && e.message);
      }
    };
    if (isFullAccess) {
      showConfirm("切换为完全访问", "确定切换到「" + (option.name || option.value) + "」吗？此模式允许工具直接修改文件，风险较高。", "确认切换", () => void doSwitch());
    } else {
      await doSwitch();
    }
