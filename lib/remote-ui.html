  function showConfirm(title, text, okLabel, onOk) {
    const card = $("confirm-card");
    if (!card) return;
    card.textContent = "";
    card.appendChild(mkEl("h2", null, title));
    card.appendChild(mkEl("div", "q", text));
    const actions = mkEl("div", "dlg-actions");
    const cancel = mkEl("button", null, "取消");
    const ok = mkEl("button", "primary", okLabel);
    ok.style.background = "var(--danger)";
    ok.style.borderColor = "var(--danger)";
    actions.appendChild(cancel);
    actions.appendChild(ok);
    card.appendChild(actions);
    $("confirm-dlg").classList.remove("hidden");
    const close = () => $("confirm-dlg").classList.add("hidden");
    cancel.addEventListener("click", close);
    ok.addEventListener("click", () => { close(); onOk(); });
  }

  function renderTodoPanel() {
    const el = $("todo-panel");
    if (!el) return;
    el.textContent = "";
    const list = todos && todos.length ? todos : null;
    if (!list) { el.classList.add("hidden"); return; }
    el.classList.remove("hidden");
    const done = list.filter((t) => t.status === "completed").length;
    const active = list.filter((t) => t.status === "in_progress").length;
    const pending = list.length - done - active;
    const head = document.createElement("button");
    head.className = "todo-head";
    head.type = "button";
    head.appendChild(mkTitle(todoOpen ? "▾ 任务清单" : "▸ 任务清单"));
    const parts = [];
    if (done) parts.push(done + " 已完成");
    if (active) parts.push(active + " 进行中");
    if (pending) parts.push(pending + " 待处理");
    if (parts.length) {
      const stats = document.createElement("span");
      stats.className = "todo-stats";
      stats.textContent = parts.join(" · ");
      head.appendChild(stats);
    }
    head.addEventListener("click", () => { todoOpen = !todoOpen; renderTodoPanel(); });
    el.appendChild(head);
    if (todoOpen) {
      const ul = document.createElement("div");
      ul.className = "todo-list";
      for (const item of list) {
        const row = document.createElement("div");
        row.className = "todo-item";
        const glyph = document.createElement("span");
        glyph.className = "todo-glyph g-" + item.status;
        if (item.status === "completed") {
          glyph.textContent = "✓";
        } else {
          const ring = document.createElement("span");
          ring.className = "todo-ring";
          glyph.appendChild(ring);
        }
        const content = document.createElement("span");
        content.className = "todo-content";
        content.textContent = item.content;
        row.appendChild(glyph);
        row.appendChild(content);
        ul.appendChild(row);
      }
      el.appendChild(ul);
    }
  }

  function mkTitle(text) {
    const s = document.createElement("span");
    s.textContent = text;
    s.style.flex = "none";
    return s;
  }

  function fetchWithTimeout(url, init, ms) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), ms);
    return fetch(url, Object.assign({}, init, { signal: ctl.signal }))
      .finally(() => clearTimeout(timer));
  }

  async function apiWithTimeout(method, payload, ms) {
    const body = JSON.stringify({ type: "client-request", rpcId: rpcId(), method, payload: payload ?? {} });
    const res = await fetchWithTimeout("/api/" + method, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body
    }, ms);
    if (!res.ok) throw new Error("HTTP " + res.status + " " + method);
    const full = await res.json();
    if (!full.result || !full.result.ok) throw new Error((full.result && full.result.error && full.result.error.message) || "RPC failed: " + method);
    return full.result.value;
  }

  async function fetchWindow(sessionId, maxPages, opts) {
    // backward pages from the tail, newest page first; each page stays in
    // ascending seq order. Stops at maxPages / event cap / end of history.
    const o = opts || {};
    const pagesArr = [];
    let beforeSeq = undefined;
    let total = 0;
    let hasMore = false;
    let projections = null;
    for (let i = 0; i < maxPages; i++) {
      const payload = { sessionId, maxMessages: SYNC_PAGE_MESSAGES };
      if (beforeSeq !== undefined) payload.beforeSeq = beforeSeq;
      let value;
      try {
        value = await apiWithTimeout("session.history", payload, FETCH_TIMEOUT);
      } catch (e) {
        if (total === 0) throw e;
        break; // partial content is still useful — stop quietly
      }
      if (i === 0 && value.projections) projections = value.projections;
      const pageEvents = [];
      for (const entry of value.events || []) {
        const ev = entry && entry.event;
        if (ev) pageEvents.push(ev);
      }
      pagesArr.push(pageEvents);
      total += pageEvents.length;
      hasMore = value.hasMore === true;
      let pageOldest;
      for (const ev of pageEvents) {
        if (ev.seq !== undefined) { pageOldest = ev.seq; break; }
      }
      if (pageOldest === undefined || !hasMore) break;
      beforeSeq = pageOldest;
      if (total >= (o.eventCap || SYNC_EVENT_CAP)) break;
    }
    return { pages: pagesArr, total, hasMore, projections };
  }

  function syncHistory(sessionId, opts) {
    // concurrent callers (subscribed catch-up, poll fallback, foreground
    // recovery) share one in-flight run instead of racing each other
    if (syncPromise) return syncPromise;
    syncPromise = (async () => {
    // Incremental catch-up from the current seenSeq: fetch the tail page,
    // then bridge older pages (beforeSeq) until a page reaches back to the
    // cached position. Pages arrive newest-page-first with ascending seqs
    // INSIDE each page — so collected pages are applied oldest-page-first,
    // keeping every page's internal (chronological) order intact. Returns
    // true when the fetch bridged completely (cache snapshot is complete).
    const o = opts || {};
    const target = seenSeq;
    let beforeSeq = undefined;
    let pages = 0;
    let total = 0;
    const collectedPages = [];
    const applyCollected = (dropOld) => {
      // the user may have switched sessions while the fetch ran — never apply
      // another session's events into the current timeline
      if (!current || current.sessionId !== sessionId) return false;
      if (dropOld) {
        // gap too large: drop the oldest cached content, keep only the newest
        // contiguous slice. The dropped range (incl. the gap) stays reachable
        // through the "load older" button, so nothing is permanently lost.
        events.length = 0;
        oldestSeq = 0;
        olderMore = true;
      }
      for (let p = collectedPages.length - 1; p >= 0; p--) {
        const page = collectedPages[p];
        for (const ev of page) {
          pushEvent(ev, o.liveFrom !== undefined && ev.seq !== undefined && ev.seq > o.liveFrom);
        }
      }
      if (total > 0) renderTimeline();
      return true;
    };
    while (pages < SYNC_MAX_PAGES) {
      // incremental catch-up uses a small page: the gap is usually tiny and a
      // 40-message page can carry ~40k events (~8MB) that are mostly already
      // cached
      const payload = { sessionId, maxMessages: DELTA_PAGE_MESSAGES };
      if (beforeSeq !== undefined) payload.beforeSeq = beforeSeq;
      let value;
      try {
        value = await apiWithTimeout("session.history", payload, FETCH_TIMEOUT);
      } catch (e) {
        if (!o.quiet) setSyncHint("同步失败：" + (e && e.message));
        return false;
      }
      // the tail page (first fetch) carries the projections baseline
      if (pages === 0 && value.projections) applyProjections(value.projections);
      const list = value.events || [];
      const fresh = [];
      for (const entry of list) {
        const ev = entry && entry.event;
        if (ev && (ev.seq === undefined || ev.seq > target)) { fresh.push(ev); total++; }
      }
      collectedPages.push(fresh);
      // the page's oldest seq tells us whether we reached the cache boundary
      let pageOldest;
      for (const entry of list) {
        const ev = entry && entry.event;
        if (ev && ev.seq !== undefined) { pageOldest = ev.seq; break; }
      }
      if (pageOldest === undefined || pageOldest <= target || value.hasMore !== true) {
        const bridged = pageOldest === undefined || pageOldest <= target;
        const applied = applyCollected(false);
        return applied ? bridged : false;
      }
      if (total >= SYNC_EVENT_CAP) {
        // Event budget exhausted without reaching the cache boundary — drop the
        // oldest cached content and keep only the newest contiguous slice; the
        // dropped range stays reachable via the "load older" button.
        applyCollected(true);
        return false;
      }
      beforeSeq = pageOldest;
      pages++;
    }
    // Page budget exhausted without bridging — same as the event-cap case.
    applyCollected(true);
    return false;
    })().finally(() => { syncPromise = null; });
    return syncPromise;
  }

  async function loadOlder() {
    // fetch one more backward page and prepend it to the timeline head
    if (!current || loadingOlder) return;
    loadingOlder = true;
    renderTimeline(); // show the busy state on the button
    try {
      const payload = { sessionId: current.sessionId, maxMessages: SYNC_PAGE_MESSAGES };
      if (oldestSeq > 0) payload.beforeSeq = oldestSeq;
      const value = await apiWithTimeout("session.history", payload, FETCH_TIMEOUT);
      const list = value.events || [];
      const tmp = [];
      for (const entry of list) {
        const ev = entry && entry.event;
        if (!ev) continue;
        aggregateInto(ev, tmp, false);   // head insertion — bypass the seq guard
      }
      if (tmp.length > 0) {
        events.unshift(...tmp);
        const first = tmp[0];
        if (first && first.seq !== undefined) oldestSeq = first.seq;
        renderTimeline();
        saveCache(current.sessionId, events, seenSeq);
      }
      olderMore = value.hasMore === true;
      if (!olderMore) renderTimeline();
    } catch (e) {
      olderMore = true;
      renderTimeline();
      appendStatus("加载更早消息失败：" + (e && e.message));
    } finally {
      loadingOlder = false;
    }
  }

  // ── pending interaction dialogs (approval / ask_user_question) ──────────
  // Wire: the mux stream pushes answerable frames approval/requested and
  // question/requested (stable rpcId, replayed verbatim on reconnect — dedupe
  // by rpcId); the answer is a client-response echoing that rpcId, POSTed to
  // /api/respond; settlement arrives as approval/resolved / question/resolved.
  const pendingDialogs = new Map();   // rpcId -> entry
  let activeDlg = null;               // entry currently shown
  let dlgTimer = null;                // auto-dismiss after an accepted answer

  function onMuxInteraction(frame, rpcId) {
    if (frame.type === "approval/requested") {
      if (pendingDialogs.has(rpcId)) return; // replay dedupe
      pendingDialogs.set(rpcId, {
        rpcId, kind: "approval", sessionId: frame.sessionId,
        payload: frame, answered: false
      });
      showDialogIfCurrent();
    } else if (frame.type === "question/requested") {
      if (pendingDialogs.has(rpcId)) return;
      pendingDialogs.set(rpcId, {
        rpcId, kind: "question", sessionId: frame.sessionId,
        payload: frame, answered: false, sel: {}, custom: {}
      });
      showDialogIfCurrent();
    } else if (frame.type === "approval/resolved") {
      for (const [id, entry] of pendingDialogs) {
        if (entry.kind === "approval" && entry.payload.approvalId === frame.approvalId) {
          dismissDialog(id);
          return;
        }
      }
    } else if (frame.type === "question/resolved") {
      dismissDialog(frame.questionRpcId);
    }
  }

  function dismissDialog(rpcId) {
    pendingDialogs.delete(rpcId);
    if (activeDlg && activeDlg.rpcId === rpcId) {
      activeDlg = null;
      showDialogIfCurrent();
    }
  }

  function showDialogIfCurrent() {
    if (!current) { hidePendingDlg(); return; }
    let entry = null;
    for (const e of pendingDialogs.values()) {
      // show the newest interaction of the session we are looking at
      if (e.sessionId === current.sessionId) entry = e;
    }
    if (!entry) { hidePendingDlg(); return; }
    if (activeDlg && activeDlg.rpcId === entry.rpcId) return;
    activeDlg = entry;
    renderPendingDlg(entry);
  }

  function hidePendingDlg() {
    $("pending-dlg").classList.add("hidden");
  }

  function mkEl(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function renderPendingDlg(entry) {
    const card = $("pd-card");
    card.textContent = "";
    $("pending-dlg").classList.remove("hidden");
    if (entry.kind === "approval") renderApprovalDlg(card, entry);
    else renderQuestionDlg(card, entry);
  }

  async function respond(rpcId, result) {
    const res = await fetch("/api/respond", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ type: "client-response", rpcId, result })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  function armDlgAutoClose(rpcId) {
    if (dlgTimer !== null) clearTimeout(dlgTimer);
    dlgTimer = setTimeout(() => dismissDialog(rpcId), 8000);
  }

  // ── approval: 允许一次 / 拒绝 ──
  function renderApprovalDlg(card, entry) {
    const p = entry.payload;
    const h2 = mkEl("h2", null, "需要授权");
    h2.appendChild(mkEl("span", "tag warn", p.toolName || "工具"));
    card.appendChild(h2);
    card.appendChild(mkEl("div", "q", p.reason || "智能体请求执行该工具"));
    // attach the paired tool call's argument preview when we have it
    const tool = events.find((e) => e.kind === "tool" && e.callId && e.callId === p.callId);
    card.appendChild(mkEl("div", "detail", tool ? toolPreview(tool) : "工具：" + (p.toolName || "?")));
    const actions = mkEl("div", "dlg-actions");
    const reject = mkEl("button", null, "拒绝");
    const allow = mkEl("button", "primary", "允许一次");
    actions.appendChild(reject);
    actions.appendChild(allow);
    card.appendChild(actions);
    if (entry.answered) {
      reject.disabled = true;
      allow.disabled = true;
      card.appendChild(mkEl("div", "state", "已提交，等待处理…"));
    } else {
      reject.addEventListener("click", () => void answerApproval(entry, "rejected"));
      allow.addEventListener("click", () => void answerApproval(entry, "allowed-once"));
    }
  }

  async function answerApproval(entry, outcome) {
    if (entry.answered) return;
    entry.answered = true;
    renderPendingDlg(entry);
    try {
      const receipt = await respond(entry.rpcId, {
        ok: true,
        value: {
          sessionId: entry.sessionId,
          approvalId: entry.payload.approvalId,
          outcome
        }
      });
      if (!receipt.accepted) dismissDialog(entry.rpcId);
      else armDlgAutoClose(entry.rpcId);
    } catch (e) {
      entry.answered = false;
      renderPendingDlg(entry);
    }
  }

  // ── user questions (ask_user_question): options / multi-select / text ──
  function renderQuestionDlg(card, entry) {
    const p = entry.payload;
    const planReview = (p.questions || []).some((q) => q.intent && q.intent.kind === "plan-review");
    const h2 = mkEl("h2", null, "请回答");
    h2.appendChild(mkEl("span", "tag", planReview ? "计划审批" : "提问"));
    card.appendChild(h2);
    const qs = p.questions || [];
    for (const q of qs) {
      if (q.header) card.appendChild(mkEl("div", "hd", q.header));
      card.appendChild(mkEl("div", "q", q.question));
      if (q.detail) card.appendChild(mkEl("div", "detail", q.detail));
      const opts = q.options || [];
      if (opts.length > 0) {
        const box = mkEl("div", "opts");
        const sel = entry.sel[q.id] || (entry.sel[q.id] = new Set());
        for (const o of opts) {
          const b = mkEl("button", "opt" + (sel.has(o.label) ? " on" : ""));
          const ck = mkEl("span", "ck");
          const ol = mkEl("span", "ol");
          ol.appendChild(mkEl("span", "on", o.label));
          if (o.description) ol.appendChild(mkEl("span", "od", o.description));
          b.appendChild(ck);
          b.appendChild(ol);
          b.addEventListener("click", () => {
            if (q.multiSelect === true) {
              if (sel.has(o.label)) sel.delete(o.label); else sel.add(o.label);
            } else if (sel.has(o.label)) {
              sel.delete(o.label);
            } else {
              sel.clear();
              sel.add(o.label);
            }
            renderPendingDlg(entry);
          });
          box.appendChild(b);
        }
        card.appendChild(box);
      } else {
        const ta = mkEl("textarea");
        ta.rows = 3;
        ta.placeholder = "输入回答…";
        ta.value = entry.custom[q.id] || "";
        ta.addEventListener("input", () => { entry.custom[q.id] = ta.value; });
        card.appendChild(ta);
      }
    }
    if (qs.length === 0) card.appendChild(mkEl("div", "q", "（无待回答问题）"));
    const actions = mkEl("div", "dlg-actions");
    const cancel = mkEl("button", null, "取消");
    const submit = mkEl("button", "primary", "提交");
    actions.appendChild(cancel);
    actions.appendChild(submit);
    card.appendChild(actions);
    if (entry.answered) {
      cancel.disabled = true;
      submit.disabled = true;
      card.appendChild(mkEl("div", "state", "已提交，等待处理…"));
    } else {
      cancel.addEventListener("click", () => void cancelQuestion(entry));
      submit.addEventListener("click", () => void submitQuestions(entry));
    }
  }

  async function submitQuestions(entry) {
    if (entry.answered) return;
    entry.answered = true;
    renderPendingDlg(entry);
    try {
      const answers = [];
      for (const q of entry.payload.questions || []) {
        const selected = [...(entry.sel[q.id] || [])];
        const custom = (entry.custom[q.id] || "").trim();
        const a = { id: q.id, selected };
        if (custom) a.custom = custom;
        answers.push(a);
      }
      const receipt = await respond(entry.rpcId, {
        ok: true,
        value: { sessionId: entry.sessionId, answer: { answers } }
      });
      if (!receipt.accepted) dismissDialog(entry.rpcId);
      else armDlgAutoClose(entry.rpcId);
    } catch (e) {
      entry.answered = false;
      renderPendingDlg(entry);
    }
  }

  async function cancelQuestion(entry) {
    try {
      await respond(entry.rpcId, {
        ok: false,
        error: { code: "cancelled", message: "user cancelled", details: {} }
      });
    } catch (e) {}
    dismissDialog(entry.rpcId);
  }

  // ── composer textarea auto-grow (default = send-button height, max 5 lines)
  function autoresize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  }

  async function stopTurn() {
    if (!current) return;
    stopping = true;
    setWorking(false);
    try {
      await api("session.cancel", { sessionId: current.sessionId });
      appendStatus("已停止");
    } catch (e) {
      stopping = false;
      setWorking(true); // cancel failed — restore the working state
      appendStatus("停止失败：" + (e && e.message));
    }
  }

  async function send() {
    const text = $("input").value.trim();
    if (!text || !current) return;
    $("input").value = "";
    autoresize($("input"));
    // a leading slash is a command — dispatch via the Typert commands
    // service, not the model (session.prompt would forward it to the model)
    if (text.startsWith("/")) {
      try {
        await execCommand(current.sessionId, text);
        appendStatus("已执行命令：" + text);
        void refreshStatBar();
      } catch (e) {
        appendStatus("命令执行失败：" + (e && e.message));
      }
      return;
    }
    // optimistic echo: show the user bubble immediately; the streamed
    // user/message event is deduped against this trailing optimistic entry
    events.push({ kind: "user", text, optimistic: true });
    renderTimeline();
    // the turn starts now — light the working indicator even before any
    // output arrives (covers the whole thinking phase)
    stopping = false;
    setWorking(true);
    try {
      await api("session.prompt", {
        sessionId: current.sessionId,
        mode: "queue",
        content: [{ type: "text", text }]
      });
      if (!ws) { await syncHistory(current.sessionId, { quiet: true }); saveCache(current.sessionId, events, seenSeq); }
      void refreshStatBar();
    } catch (e) {
      appendStatus("发送失败：" + (e && e.message));
    }
  }

  // ── models sheet (provider chips → model list → effort chips) ───────────
  let modelData = null;
  let mProvider = "";
  let mModel = "";
  let mEffort = "";
  let mEffortTouched = false;  // user picked an effort — preferred must not overwrite it
  let currentModelLabel = "模型…";

  async function openModelsSheet() {
    $("models-sheet").classList.remove("hidden");
    $("m-err").textContent = "";
    try {
      modelData = await api("session.models", { sessionId: current.sessionId });
      mProvider = modelData.current.provider;
      mModel = modelData.current.model;
      mEffortTouched = false;   // (re)open the sheet — re-init from current/default
      currentModelLabel = modelLabelFrom(modelData);
      $("sb-model").textContent = currentModelLabel;
      renderModelSheet();
    } catch (e) {
      $("m-err").textContent = "无法读取模型：" + (e && e.message);
    }
  }
  function renderModelSheet() {
    // level 1: provider chips
    const pc = $("m-providers");
    pc.textContent = "";
    for (const g of modelData.groups || []) {
      const b = document.createElement("button");
      b.className = "chip" + (g.id === mProvider ? " on" : "");
      b.textContent = g.name || g.id;
      b.addEventListener("click", () => {
        mProvider = g.id;
        mModel = (g.models && g.models[0] ? g.models[0].id : "");
        renderModelSheet();
      });
      pc.appendChild(b);
    }
    // level 2: model list
    const group = (modelData.groups || []).find((g) => g.id === mProvider);
    const mc = $("m-models");
    mc.textContent = "";
    for (const model of group?.models || []) {
      const b = document.createElement("button");
      b.className = "mrow" + (model.id === mModel ? " on" : "");
      const nm = document.createElement("span"); nm.className = "mn"; nm.textContent = model.name || model.id;
      b.appendChild(nm);
      if (model.description) {
        const d = document.createElement("span"); d.className = "md"; d.textContent = model.description;
        b.appendChild(d);
      }
      b.addEventListener("click", () => { mModel = model.id; mEffortTouched = false; renderModelSheet(); });
      mc.appendChild(b);
    }
    // level 3: effort chips
    const efforts = (group?.models || []).find((x) => x.id === mModel)?.reasoning?.efforts || [];
    const er = $("m-efforts");
    if (efforts.length === 0) { er.classList.add("hidden"); return; }
    er.classList.remove("hidden");
    er.textContent = "";
    // preferred (current effort or the model's default) initializes the
    // selection ONLY until the user picks an effort themselves — otherwise
    // every re-render would overwrite the user's choice (v46)
    if (!mEffortTouched) {
      const preferred = (modelData.current.provider === mProvider && modelData.current.model === mModel)
        ? modelData.current.reasoningEffort
        : (group?.models || []).find((x) => x.id === mModel)?.reasoning?.defaultEffort;
      if (preferred) mEffort = preferred;
    }
    for (const eff of efforts) {
      const b = document.createElement("button");
      b.className = "chip" + (eff.id === mEffort ? " on" : "");
      b.textContent = eff.name || eff.id;
      b.addEventListener("click", () => { mEffort = eff.id; mEffortTouched = true; renderModelSheet(); });
      er.appendChild(b);
    }
  }
  async function saveModel() {
    try {
      const payload = { sessionId: current.sessionId, provider: mProvider, model: mModel };
      if (!$("m-efforts").classList.contains("hidden") && mEffort) payload.reasoningEffort = mEffort;
      const value = await api("session.selectModel", payload);
      const group = (modelData.groups || []).find((g) => g.id === mProvider);
      const model = (group?.models || []).find((x) => x.id === mModel);
      const label = model?.name || mModel;
      const eff = value.selected?.reasoningEffort || mEffort;
      currentModelLabel = eff ? label + " · " + eff : label;
      $("sb-model").textContent = currentModelLabel;
      $("models-sheet").classList.add("hidden");
      appendStatus("模型已切换：" + currentModelLabel);
    } catch (e) {
      $("m-err").textContent = "切换失败：" + (e && e.message);
    }
  }

  // ── mode sheet (work-mode / agent preset switch) ────────────────────────
  async function openModeSheet() {
    $("mode-sheet").classList.remove("hidden");
    $("mode-err").textContent = "";
    try {
      const value = await api("agentPreset.list", {});
      const presets = value.presets || [];
      const list = $("mode-list");
      list.textContent = "";
      const currentPreset = current?.agentPreset;
      for (const p of presets) {
        const b = document.createElement("button");
        b.className = "mrow" + (p.id === currentPreset ? " on" : "");
        const nm = document.createElement("span"); nm.className = "mn"; nm.textContent = p.name || p.id;
        b.appendChild(nm);
        if (p.description) {
          const d = document.createElement("span"); d.className = "md"; d.textContent = p.description;
          b.appendChild(d);
        }
        b.addEventListener("click", async () => {
          try {
            await api("agentPreset.select", { sessionId: current.sessionId, agentPreset: p.id });
            current.agentPreset = p.id;
            $("mode-btn").textContent = presetShortName(p.id);
            $("mode-btn").title = "工作模式：" + p.id;
            $("mode-sheet").classList.add("hidden");
            appendStatus("已切换到模式：" + (p.name || p.id));
          } catch (e) {
            $("mode-err").textContent = "切换失败：" + (e && e.message);
          }
        });
        list.appendChild(b);
      }
    } catch (e) {
      $("mode-err").textContent = "无法读取模式：" + (e && e.message);
    }
  }

  // ── bottom stat bar: model chip + cache hit + used tokens ──────────────
  function fmtTokens(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(0) + "k";
    return String(n);
  }
  function modelLabelFrom(data) {
    const group = (data.groups || []).find((g) => g.id === data.current.provider);
    const model = (group?.models || []).find((x) => x.id === data.current.model);
    const name = model?.name || data.current.model;
    const effort = data.current.reasoningEffort || model?.reasoning?.defaultEffort;
    return effort ? name + " · " + effort : name;
  }
  async function loadModelLabel() {
    if (!current) return;
    try {
      const data = await api("session.models", { sessionId: current.sessionId });
      currentModelLabel = modelLabelFrom(data);
      $("sb-model").textContent = currentModelLabel;
    } catch (e) {}
  }
  async function refreshStatBar() {
    if (!current) return;
    try {
      const value = await api("session.list", {});
      const item = (value.items || []).find((s) => s.sessionId === current.sessionId);
      if (!item) return;
      const proj = item.projections && item.projections.values;
      if (proj && proj.permissions !== undefined) applyPermissions(proj.permissions, item.projections && item.projections.asOfSeq);
      const tu = (proj && proj.tokenUsage) || {};
      const stats = (proj && proj.sessionStats) || {};
      const cached = tu.cacheReadTokens || 0;
      const uncached = tu.uncachedInputTokens || 0;
      const total = cached + uncached;
      const hit = total > 0 ? Math.round((cached / total) * 100) : 0;
      const decodeMs = stats.decodeMs || 0;
      const decodeTokens = stats.decodeTokens || 0;
      const tps = decodeMs > 0 ? Math.round((decodeTokens / decodeMs) * 1000) : 0;
      const input = (tu.uncachedInputTokens || 0) + (tu.cacheReadTokens || 0) + (tu.cacheWriteTokens || 0);
      const output = tu.outputTokens || 0;
      $("sb-line1").textContent = "缓存 " + hit + "% · " + tps + " tok/s";
      $("sb-line2").textContent = "输入 " + fmtTokens(input) + " · 输出 " + fmtTokens(output);
      $("sb-model").textContent = currentModelLabel;
    } catch (e) {}
  }
  function startStatTimer() {
    stopStatTimer();
    statTimer = setInterval(() => { void refreshStatBar(); }, 12000);
  }
  function stopStatTimer() {
    if (statTimer) { clearInterval(statTimer); statTimer = null; }
  }

  boot();
})();
</script>
</body>
</html>
